
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Notes, tasks and checklists in one place.">
<title>Evernote Lite</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
:root {
  --green:#16865b; --green2:#e6f4eb; --bg:#f7f9f7;
  --surface:#fff; --text:#202820; --muted:#778078;
  --line:#e5ebe5; --shadow:0 4px 18px #183b2410;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
 outline:2px solid var(--green);outline-offset:2px
}
header{height:66px;background:white;border-bottom:1px solid var(--line);
 display:flex;align-items:center;gap:14px;padding:0 20px;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:800;white-space:nowrap}
.logo{width:35px;height:35px;border-radius:11px;background:var(--green);color:white;
 display:grid;place-items:center;font-size:22px}
.search{flex:1;max-width:650px;margin:auto;position:relative}
.search span{position:absolute;left:13px;top:10px;color:#78857a}
.search input{width:100%;border:0;background:#f0f4f0;border-radius:12px;padding:12px 14px 12px 38px}
.header-buttons{display:flex;gap:7px}
.btn-icon{border:0;background:#f0f4f0;border-radius:10px;padding:10px;color:#455449}
.layout{display:flex;max-width:1500px;margin:auto;min-height:calc(100vh - 66px)}
aside{width:220px;padding:23px 12px;flex-shrink:0}
.nav{width:100%;display:flex;gap:12px;align-items:center;text-align:left;
 padding:13px 16px;border:0;background:transparent;border-radius:0 25px 25px 0;
 color:#536056;margin:3px 0;font-size:14px}
.nav.active,.nav:hover{background:var(--green2);color:#106b48;font-weight:700}
.nav-label{font-size:11px;color:#9aa39b;font-weight:bold;letter-spacing:1px;margin:25px 15px 8px}
main{flex:1;min-width:0;padding:28px 25px 90px}
.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
h1{font-size:25px;margin:0 0 5px}
.subtitle{font-size:13px;color:var(--muted)}
.primary{border:0;border-radius:11px;padding:12px 17px;background:var(--green);color:white;font-weight:bold}
.primary:hover{background:#106b48}
.secondary{border:1px solid var(--line);background:white;border-radius:10px;padding:10px 13px;color:#536056}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid var(--line);background:white;border-radius:20px;padding:8px 14px;color:#657067;font-size:12px}
.chip.active{background:var(--green2);color:#106b48;border-color:#c9e4d1;font-weight:bold}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat{background:white;border:1px solid var(--line);border-radius:13px;padding:14px}
.stat strong{display:block;color:var(--green);font-size:23px}
.stat span{font-size:12px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:14px;align-items:start}
.card{background:white;border:1px solid var(--line);border-radius:14px;padding:15px;
 box-shadow:var(--shadow);overflow:hidden;min-width:0}
.card.pinned{border-top:3px solid var(--green)}
.card h3{font-size:16px;margin:0 28px 9px 0;overflow-wrap:anywhere}
.card-content{font-size:13px;color:#566158;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.card-top{display:flex;justify-content:space-between;align-items:start}
.pin-button{border:0;background:transparent;color:#758078;padding:2px 4px}
.meta{font-size:11px;color:#89948b;margin-top:13px;display:flex;gap:6px;flex-wrap:wrap}
.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:13px}
.actions button{border:0;background:#f1f4f1;color:#526056;border-radius:7px;padding:7px 9px;font-size:11px}
.actions button:hover{background:var(--green2);color:#106b48}
.check-item{display:flex;align-items:flex-start;gap:9px;margin:8px 0;font-size:13px;color:#536056}
.check-item input{margin-top:3px;accent-color:var(--green)}
.checked{text-decoration:line-through;color:#9aa39b}
.empty{grid-column:1/-1;text-align:center;padding:65px 15px;color:var(--muted)}
.empty strong{display:block;font-size:18px;color:#465248;margin:10px}
.banner{display:none;background:#e8f5eb;border:1px solid #d1e9d8;border-radius:13px;
 padding:14px;margin-bottom:20px;align-items:center;justify-content:space-between;gap:12px}
.banner p{font-size:12px;color:#637066;margin:5px 0 0}
.overlay{display:none;position:fixed;inset:0;background:#102016aa;z-index:20;
 align-items:center;justify-content:center;padding:14px}
.overlay.open{display:flex}
.dialog{background:white;width:min(560px,100%);max-height:92vh;overflow:auto;
 border-radius:18px;padding:21px}
.dialog-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
.dialog-head h2{font-size:20px;margin:0}
.close{border:0;border-radius:50%;width:34px;height:34px;background:#f0f4f0}
.field{margin:13px 0}
.field label{display:block;font-size:12px;font-weight:bold;color:#657067;margin-bottom:7px}
.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #dfe7df;
 border-radius:10px;background:white;color:#263329}
.field textarea{min-height:130px;resize:vertical;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dialog-footer{display:flex;justify-content:space-between;gap:8px;margin-top:17px}
.footer-right{display:flex;gap:8px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
 background:#26392d;color:white;padding:12px 17px;border-radius:11px;
 z-index:50;display:none;font-size:13px;max-width:90%;text-align:center}
.toast.show{display:block}
.mobile-nav{display:none}
@media(max-width:760px){
 header{height:59px;padding:0 11px;gap:9px}
 .brand{font-size:16px}.logo{width:31px;height:31px}
 .search input{padding:10px 8px 10px 33px}.search span{top:8px;left:10px}
 .header-buttons .desktop{display:none}
 aside{display:none}
 main{padding:21px 13px 100px}
 h1{font-size:22px}
 .cards{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:9px}
 .card{padding:12px}.card h3{font-size:15px}
 .actions button{padding:7px}
 .mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:8;
 background:white;border-top:1px solid var(--line);justify-content:space-around;
 padding:8px 3px calc(8px + env(safe-area-inset-bottom))}
 .mobile-nav button{border:0;background:transparent;color:#718074;font-size:10px;
 display:grid;gap:3px;justify-items:center}
 .mobile-nav button.active{color:var(--green);font-weight:bold}
 .mobile-nav b{font-size:19px}
 .stats{gap:7px}.stat{padding:10px}.stat strong{font-size:19px}
 .banner{align-items:flex-start;flex-direction:column}
 .heading{align-items:flex-start}
}
</style>
</head>
<body>

<header>
 <div class="brand"><div class="logo">✦</div>Evernote Lite</div>
 <div class="search"><span>⌕</span><input id="search" type="search" placeholder="Search notes and tasks"></div>
 <div class="header-buttons">
  <button class="btn-icon desktop" data-action="export" title="Backup">⇩</button>
  <button class="btn-icon desktop" data-action="import" title="Restore">⇧</button>
  <button class="btn-icon" data-action="notifications" title="Notifications">♧</button>
 </div>
 <input id="importFile" type="file" accept=".json,application/json" hidden>
</header>

<div class="layout">
<aside>
 <button class="nav active" data-view="all">▦ All notes</button>
 <button class="nav" data-view="notes">▤ Notes</button>
 <button class="nav" data-view="tasks">☑ Tasks</button>
 <button class="nav" data-view="checklists">☷ Checklists</button>
 <div class="nav-label">ORGANISE</div>
 <button class="nav" data-view="pinned">📌 Pinned</button>
 <button class="nav" data-view="archive">▣ Archive</button>
 <button class="nav" data-view="trash">♲ Trash</button>
 <div class="nav-label">YOUR DATA</div>
 <button class="nav" data-action="export">⇩ Backup notes</button>
 <button class="nav" data-action="import">⇧ Restore backup</button>
</aside>

<main>
 <div class="heading">
  <div><h1 id="pageTitle">All notes</h1><div class="subtitle">Your ideas, plans and reminders.</div></div>
  <button class="primary" data-action="new">＋ Create</button>
 </div>

 <div class="banner" id="notificationBanner">
  <div><strong>Enable reminders</strong><p>Allow notifications for reminders while the app is active.</p></div>
  <button class="primary" data-action="enableNotifications">Enable</button>
 </div>

 <div class="stats" id="stats">
  <div class="stat"><strong id="noteCount">0</strong><span>Notes</span></div>
  <div class="stat"><strong id="taskCount">0</strong><span>Open tasks</span></div>
  <div class="stat"><strong id="doneCount">0</strong><span>Completed</span></div>
 </div>

 <div class="filters" id="filters">
  <button class="chip active" data-filter="all">Everything</button>
  <button class="chip" data-filter="today">Due today</button>
  <button class="chip" data-filter="overdue">Overdue</button>
  <button class="chip" data-filter="high">High priority</button>
 </div>

 <section class="cards" id="cards" aria-live="polite"></section>
</main>
</div>

<nav class="mobile-nav">
 <button class="active" data-view="all"><b>▦</b>All</button>
 <button data-view="notes"><b>▤</b>Notes</button>
 <button data-view="tasks"><b>☑</b>Tasks</button>
 <button data-view="checklists"><b>☷</b>Lists</button>
 <button data-view="pinned"><b>📌</b>Pinned</button>
</nav>

<div class="overlay" id="editorOverlay">
 <form class="dialog" id="editorForm">
  <div class="dialog-head">
   <h2 id="editorHeading">Create item</h2>
   <button type="button" class="close" data-action="close">✕</button>
  </div>
  <input type="hidden" id="itemId">
  <div class="field">
   <label for="itemType">TYPE</label>
   <select id="itemType">
    <option value="note">Note</option>
    <option value="task">Task</option>
    <option value="checklist">Checklist</option>
   </select>
  </div>
  <div class="field">
   <label for="itemTitle">TITLE</label>
   <input id="itemTitle" maxlength="120" placeholder="Enter a title">
  </div>
  <div class="field">
   <label id="contentLabel" for="itemBody">CONTENT</label>
   <textarea id="itemBody" placeholder="Write your note here..."></textarea>
  </div>
  <div class="two">
   <div class="field"><label for="itemDue">DUE DATE</label><input id="itemDue" type="date"></div>
   <div class="field"><label for="itemPriority">PRIORITY</label>
    <select id="itemPriority"><option value="normal">Normal</option><option value="low">Low</option><option value="high">High</option></select>
   </div>
  </div>
  <div class="field"><label for="itemLabel">LABEL</label><input id="itemLabel" maxlength="35" placeholder="Personal, Work, Study..."></div>
  <div class="field"><label for="itemColor">COLOUR</label>
   <select id="itemColor">
    <option value="#ffffff">White</option>
    <option value="#fff4c7">Yellow</option>
    <option value="#fce1dc">Pink</option>
    <option value="#e2f1ff">Blue</option>
    <option value="#e5f4e8">Green</option>
    <option value="#f0e5ff">Purple</option>
   </select>
  </div>
  <div class="dialog-footer">
   <button type="button" class="secondary" id="deleteButton" data-action="deleteCurrent" hidden>Move to trash</button>
   <div class="footer-right">
    <button type="button" class="secondary" data-action="close">Cancel</button>
    <button type="submit" class="primary">Save</button>
   </div>
  </div>
 </form>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
'use strict';

const DB_NAME = 'EvernoteLiteDB';
const DB_VERSION = 1;
const STORE = 'items';

let db = null;
let items = [];
let currentView = 'all';
let currentFilter = 'all';

const $ = id => document.getElementById(id);

function escapeHTML(value) {
 return String(value ?? '').replace(/[&<>"']/g, char => ({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 }[char]));
}

function toast(message) {
 const el = $('toast');
 el.textContent = message;
 el.classList.add('show');
 clearTimeout(toast.timer);
 toast.timer = setTimeout(() => el.classList.remove('show'), 2600);
}

function openDatabase() {
 return new Promise((resolve, reject) => {
  const request = indexedDB.open(DB_NAME, DB_VERSION);
  request.onupgradeneeded = () => {
   if (!request.result.objectStoreNames.contains(STORE)) {
    request.result.createObjectStore(STORE, {keyPath:'id'});
   }
  };
  request.onsuccess = () => resolve(request.result);
  request.onerror = () => reject(request.error);
 });
}

function getAll() {
 return new Promise((resolve, reject) => {
  const request = db.transaction(STORE,'readonly').objectStore(STORE).getAll();
  request.onsuccess = () => resolve(request.result);
  request.onerror = () => reject(request.error);
 });
}

function put(item) {
 return new Promise((resolve,reject) => {
  const tx = db.transaction(STORE,'readwrite');
  tx.objectStore(STORE).put(item);
  tx.oncomplete = resolve;
  tx.onerror = () => reject(tx.error);
 });
}

function removeFromDB(id) {
 return new Promise((resolve,reject) => {
  const tx = db.transaction(STORE,'readwrite');
  tx.objectStore(STORE).delete(id);
  tx.oncomplete = resolve;
  tx.onerror = () => reject(tx.error);
 });
}

function today() {
 const d = new Date();
 return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

async function reload() {
 items = await getAll();
 render();
}

function setView(view) {
 currentView = view;
 currentFilter = 'all';
 document.querySelectorAll('[data-view]').forEach(button => {
  button.classList.toggle('active',button.dataset.view === view);
 });
 document.querySelectorAll('[data-filter]').forEach(button => {
  button.classList.toggle('active',button.dataset.filter === 'all');
 });
 const names = {
  all:'All notes',notes:'Notes',tasks:'Tasks',checklists:'Checklists',
  pinned:'Pinned',archive:'Archive',trash:'Trash'
 };
 $('pageTitle').textContent = names[view] || 'All notes';
 $('stats').hidden = !['all','notes'].includes(view);
 $('filters').hidden = !['all','tasks'].includes(view);
 render();
}

function setFilter(filter) {
 currentFilter = filter;
 document.querySelectorAll('[data-filter]').forEach(button => {
  button.classList.toggle('active',button.dataset.filter === filter);
 });
 render();
}

function visibleItems() {
 const query = $('search').value.toLowerCase().trim();

 return items.filter(item => {
  if (currentView === 'trash') {
   if (!item.trashed) return false;
  } else {
   if (item.trashed) return false;
   if (currentView === 'archive') {
    if (!item.archived) return false;
   } else {
    if (item.archived) return false;
    if (currentView === 'notes' && item.type !== 'note') return false;
    if (currentView === 'tasks' && item.type !== 'task') return false;
    if (currentView === 'checklists' && item.type !== 'checklist') return false;
    if (currentView === 'pinned' && !item.pinned) return false;
   }
  }

  if (currentFilter === 'today' && item.due !== today()) return false;
  if (currentFilter === 'overdue' &&
      (!item.due || item.due >= today() || item.done)) return false;
  if (currentFilter === 'high' && item.priority !== 'high') return false;

  const content = (item.title+' '+item.body+' '+item.label+' '+
   (item.checks||[]).map(c=>c.text).join(' ')).toLowerCase();
  return !query || content.includes(query);
 });
}

function render() {
 const active = items.filter(x => !x.trashed && !x.archived);
 $('noteCount').textContent = active.filter(x=>x.type==='note').length;
 $('taskCount').textContent = active.filter(x=>x.type==='task'&&!x.done).length;
 $('doneCount').textContent = active.filter(x=>
  (x.type==='task'&&x.done) ||
  (x.type==='checklist'&&x.checks?.length&&x.checks.every(c=>c.done))
 ).length;

 const list = visibleItems().sort((a,b)=>
  Number(b.pinned)-Number(a.pinned) || b.updatedAt-a.updatedAt
 );

 if (!list.length) {
  $('cards').innerHTML = '<div class="empty"><div style="font-size:42px">✧</div><strong>Nothing here yet</strong><span>Create a note, task or checklist to get started.</span></div>';
  return;
 }

 $('cards').innerHTML = list.map(item => {
  let content = '';

  if (item.type === 'checklist') {
   content = (item.checks||[]).map((check,index) =>
    `<label class="check-item">
      <input type="checkbox" data-action="checkItem" data-id="${escapeHTML(item.id)}" data-index="${index}" ${check.done?'checked':''}>
      <span class="${check.done?'checked':''}">${escapeHTML(check.text)}</span>
     </label>`
   ).join('');
  } else if (item.type === 'task') {
   content = `<label class="check-item">
    <input type="checkbox" data-action="toggleTask" data-id="${escapeHTML(item.id)}" ${item.done?'checked':''}>
    <span class="${item.done?'checked':''}">${escapeHTML(item.body||'Complete this task')}</span>
   </label>`;
  } else {
   content = `<div class="card-content">${escapeHTML(item.body||'')}</div>`;
  }

  const metadata = [
   item.type,
   item.label ? '#'+escapeHTML(item.label) : '',
   item.due ? '📅 '+escapeHTML(item.due) : '',
   item.priority==='high' ? '⚑ High priority' : ''
  ].filter(Boolean).join(' · ');

  let actions = '';
  if (currentView === 'trash') {
   actions = `<button data-action="restore" data-id="${escapeHTML(item.id)}">Restore</button>
    <button data-action="permanentDelete" data-id="${escapeHTML(item.id)}">Delete forever</button>`;
  } else {
   actions = `<button data-action="edit" data-id="${escapeHTML(item.id)}">Edit</button>
    <button data-action="pin" data-id="${escapeHTML(item.id)}">${item.pinned?'Unpin':'Pin'}</button>
    <button data-action="archive" data-id="${escapeHTML(item.id)}">${item.archived?'Unarchive':'Archive'}</button>
    <button data-action="trash" data-id="${escapeHTML(item.id)}">Trash</button>`;
  }

  return `<article class="card ${item.pinned?'pinned':''}" style="background:${escapeHTML(item.color||'#ffffff')}">
   <div class="card-top"><h3>${escapeHTML(item.title||'Untitled')}</h3>
    <button class="pin-button" data-action="pin" data-id="${escapeHTML(item.id)}" aria-label="Pin note">${item.pinned?'📌':'♧'}</button>
   </div>
   ${content}
   <div class="meta">${metadata}</div>
   <div class="actions">${actions}</div>
  </article>`;
 }).join('');
}

function openEditor(item=null) {
 $('editorForm').reset();
 $('itemId').value = item?.id || '';
 $('itemType').value = item?.type || 'note';
 $('itemTitle').value = item?.title || '';
 $('itemBody').value = item?.type === 'checklist'
  ? (item.checks||[]).map(c=>c.text).join('\n')
  : item?.body || '';
 $('itemDue').value = item?.due || '';
 $('itemPriority').value = item?.priority || 'normal';
 $('itemLabel').value = item?.label || '';
 $('itemColor').value = item?.color || '#ffffff';
 $('editorHeading').textContent = item ? 'Edit item' : 'Create item';
 $('deleteButton').hidden = !item;
 updateEditorHint();
 $('editorOverlay').classList.add('open');
 $('itemTitle').focus();
}

function closeEditor() {
 $('editorOverlay').classList.remove('open');
}

function updateEditorHint() {
 const type = $('itemType').value;
 $('contentLabel').textContent =
  type==='checklist' ? 'CHECKLIST ITEMS — ONE PER LINE' :
  type==='task' ? 'TASK DETAILS' : 'CONTENT';
 $('itemBody').placeholder = type==='checklist'
  ? 'Buy groceries\nFinish assignment\nCall someone'
  : type==='task' ? 'Describe your task...' : 'Write your note here...';
}

async function saveEditor(event) {
 event.preventDefault();

 const id = $('itemId').value || crypto.randomUUID();
 const old = items.find(x=>x.id===id);
 const type = $('itemType').value;
 const body = $('itemBody').value.trim();

 const checks = type==='checklist'
  ? body.split('\n').map(t=>t.trim()).filter(Boolean).map(text=>{
    const previous = old?.checks?.find(c=>
