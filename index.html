
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#188038">
<title>My Notes & Tasks</title>

<style>
:root {
  --green: #188038;
  --green-light: #e8f5e9;
  --bg: #f8faf8;
  --text: #202124;
  --muted: #777;
  --border: #e5e8e5;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

button, input, textarea, select {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  min-height: 100vh;
}

/* HEADER */

header {
  height: 70px;
  background: white;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 22px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.logo {
  font-size: 21px;
  font-weight: bold;
  color: var(--green);
  white-space: nowrap;
}

.search {
  flex: 1;
  max-width: 650px;
  margin: auto;
}

.search input {
  width: 100%;
  padding: 13px 18px;
  border: 0;
  outline: none;
  background: #f1f3f1;
  border-radius: 12px;
}

.header-actions {
  display: flex;
  gap: 8px;
}

.icon-btn {
  border: 0;
  background: transparent;
  padding: 10px;
  border-radius: 50%;
  font-size: 19px;
}

.icon-btn:hover {
  background: var(--green-light);
}

/* LAYOUT */

.layout {
  display: flex;
}

.sidebar {
  width: 230px;
  padding: 22px 12px;
  flex-shrink: 0;
}

.nav-btn {
  width: 100%;
  border: 0;
  background: transparent;
  text-align: left;
  padding: 13px 18px;
  border-radius: 0 30px 30px 0;
  margin-bottom: 5px;
  color: #444;
}

.nav-btn.active,
.nav-btn:hover {
  background: var(--green-light);
  color: var(--green);
  font-weight: bold;
}

.main {
  flex: 1;
  padding: 28px;
  min-width: 0;
}

.page-title {
  font-size: 23px;
  margin: 0 0 20px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
  margin-bottom: 25px;
}

.stat {
  background: white;
  padding: 18px;
  border-radius: 15px;
  border: 1px solid var(--border);
}

.stat strong {
  display: block;
  font-size: 25px;
  color: var(--green);
  margin-top: 8px;
}

.add-area {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 25px;
}

.primary-btn {
  border: 0;
  background: var(--green);
  color: white;
  border-radius: 12px;
  padding: 13px 19px;
  font-weight: bold;
}

.secondary-btn {
  border: 1px solid var(--border);
  background: white;
  border-radius: 12px;
  padding: 12px 17px;
}

.primary-btn:hover {
  background: #126b2c;
}

.notes-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 16px;
}

.note-card {
  background: white;
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 17px;
  min-height: 155px;
  position: relative;
  cursor: pointer;
  transition: .15s;
  overflow-wrap: anywhere;
}

.note-card:hover {
  box-shadow: 0 4px 15px #00000012;
  transform: translateY(-2px);
}

.note-card h3 {
  margin: 0 30px 10px 0;
  font-size: 17px;
}

.note-card p {
  color: #555;
  white-space: pre-wrap;
  line-height: 1.5;
  margin: 0 0 12px;
}

.note-meta {
  color: var(--muted);
  font-size: 12px;
  margin-top: 12px;
}

.pin {
  position: absolute;
  right: 12px;
  top: 10px;
  border: 0;
  background: transparent;
  font-size: 18px;
}

.card-actions {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.card-actions button {
  border: 0;
  background: #f1f4f1;
  padding: 7px 9px;
  border-radius: 8px;
  font-size: 12px;
}

.card-actions button:hover {
  background: var(--green-light);
}

.empty {
  text-align: center;
  color: var(--muted);
  padding: 60px 15px;
}

/* EDITOR */

.overlay {
  position: fixed;
  inset: 0;
  background: #0007;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 15px;
  z-index: 50;
}

.overlay.show {
  display: flex;
}

.editor {
  background: white;
  width: min(100%, 520px);
  max-height: 90vh;
  overflow-y: auto;
  border-radius: 20px;
  padding: 23px;
}

.editor h2 {
  margin-top: 0;
}

.editor input,
.editor textarea,
.editor select {
  width: 100%;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  margin: 7px 0 13px;
  outline-color: var(--green);
  background: white;
}

.editor textarea {
  min-height: 130px;
  resize: vertical;
}

.editor label {
  font-size: 13px;
  font-weight: bold;
  color: #555;
}

.editor-actions {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  flex-wrap: wrap;
  margin-top: 15px;
}

.color-options {
  display: flex;
  gap: 10px;
  margin: 8px 0 15px;
}

.color-dot {
  width: 29px;
  height: 29px;
  border: 2px solid #ddd;
  border-radius: 50%;
  cursor: pointer;
}

.color-dot.selected {
  border: 3px solid var(--green);
}

/* CHECKLIST */

.check-row {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 9px 0;
}

.check-row input {
  width: auto;
  margin: 0;
}

.check-row span.done {
  text-decoration: line-through;
  color: #888;
}

.check-input-row {
  display: flex;
  gap: 8px;
}

.check-input-row input {
  flex: 1;
}

/* NOTIFICATION POPUP */

.notification-popup {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  place-items: center;
  padding: 20px;
  background: #0008;
}

.notification-popup[hidden] {
  display: none;
}

.notification-card {
  width: min(100%, 370px);
  padding: 27px;
  border-radius: 23px;
  background: white;
  text-align: center;
  box-shadow: 0 12px 40px #0003;
}

.notification-icon {
  font-size: 43px;
}

.notification-card h2 {
  color: var(--green);
  margin-bottom: 10px;
}

.notification-card p {
  color: #666;
  line-height: 1.5;
}

.notification-card button {
  width: 100%;
  padding: 13px;
  margin-top: 10px;
  border: 0;
  border-radius: 12px;
  cursor: pointer;
  font-weight: bold;
}

#enableNotifications {
  background: var(--green);
  color: white;
}

#laterNotifications {
  background: var(--green-light);
  color: var(--green);
}

#notificationMessage {
  font-size: 13px;
}

/* MOBILE */

.mobile-nav {
  display: none;
}

@media(max-width: 700px) {
  header {
    padding: 0 12px;
    gap: 8px;
    height: 62px;
  }

  .logo {
    font-size: 17px;
  }

  .sidebar {
    display: none;
  }

  .main {
    padding: 19px 14px 90px;
  }

  .stats {
    gap: 8px;
  }

  .stat {
    padding: 12px;
    font-size: 12px;
  }

  .stat strong {
    font-size: 21px;
  }

  .notes-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .note-card {
    padding: 13px;
    min-height: 145px;
  }

  .note-card h3 {
    font-size: 15px;
  }

  .note-card p {
    font-size: 13px;
  }

  .mobile-nav {
    display: flex;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 20;
    background: white;
    border-top: 1px solid var(--border);
    justify-content: space-around;
    padding: 8px 3px;
  }

  .mobile-nav button {
    background: transparent;
    border: 0;
    color: #666;
    font-size: 11px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    align-items: center;
  }

  .mobile-nav button.active {
    color: var(--green);
    font-weight: bold;
  }
}

@media(max-width: 370px) {
  .notes-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="logo">✦ My Notes</div>

  <div class="search">
    <input id="searchInput" placeholder="Search notes and tasks...">
  </div>

  <div class="header-actions">
    <button class="icon-btn" onclick="openNotificationSettings()" title="Notifications">🔔</button>
    <button class="icon-btn" onclick="openSettings()" title="Settings">⚙️</button>
  </div>
</header>

<div class="layout">

<aside class="sidebar">
  <button class="nav-btn active" data-view="all" onclick="changeView('all')">🏠 All items</button>
  <button class="nav-btn" data-view="notes" onclick="changeView('notes')">📝 Notes</button>
  <button class="nav-btn" data-view="tasks" onclick="changeView('tasks')">☑️ Tasks</button>
  <button class="nav-btn" data-view="checklists" onclick="changeView('checklists')">📋 Checklists</button>
  <button class="nav-btn" data-view="pinned" onclick="changeView('pinned')">📌 Pinned</button>
  <button class="nav-btn" data-view="archive" onclick="changeView('archive')">📦 Archive</button>
  <button class="nav-btn" data-view="trash" onclick="changeView('trash')">🗑️ Trash</button>
</aside>

<main class="main">
  <h1 class="page-title" id="pageTitle">All items</h1>

  <div class="stats">
    <div class="stat">Total items<strong id="totalCount">0</strong></div>
    <div class="stat">Pending tasks<strong id="pendingCount">0</strong></div>
    <div class="stat">Completed<strong id="completedCount">0</strong></div>
  </div>

  <div class="add-area">
    <button class="primary-btn" onclick="openEditor('note')">＋ New note</button>
    <button class="secondary-btn" onclick="openEditor('task')">☑ New task</button>
    <button class="secondary-btn" onclick="openEditor('checklist')">☷ Checklist</button>
  </div>

  <div class="notes-grid" id="itemsGrid"></div>
</main>
</div>

<nav class="mobile-nav">
  <button class="active" data-view="all" onclick="changeView('all')">🏠<span>Home</span></button>
  <button data-view="notes" onclick="changeView('notes')">📝<span>Notes</span></button>
  <button data-view="tasks" onclick="changeView('tasks')">☑️<span>Tasks</span></button>
  <button data-view="pinned" onclick="changeView('pinned')">📌<span>Pinned</span></button>
  <button data-view="archive" onclick="changeView('archive')">📦<span>Archive</span></button>
</nav>
</div>

<!-- EDITOR -->

<div class="overlay" id="editorOverlay">
  <div class="editor">
    <h2 id="editorHeading">Create item</h2>

    <label>Title</label>
    <input id="itemTitle" placeholder="Enter title">

    <div id="bodySection">
      <label>Details</label>
      <textarea id="itemBody" placeholder="Write something..."></textarea>
    </div>

    <div id="checklistSection" hidden>
      <label>Checklist items</label>
      <div id="checklistEditor"></div>
      <div class="check-input-row">
        <input id="newCheckItem" placeholder="Add checklist item">
        <button class="secondary-btn" onclick="addChecklistItem()">＋</button>
      </div>
    </div>

    <div id="taskFields">
      <label>Due date</label>
      <input id="itemDue" type="date">

      <label>Priority</label>
      <select id="itemPriority">
        <option value="normal">Normal</option>
        <option value="high">High</option>
        <option value="urgent">Urgent</option>
      </select>
    </div>

    <label>Label</label>
    <input id="itemLabel" placeholder="Example: Personal, Work, Study">

    <label>Colour</label>
    <div class="color-options" id="colorOptions">
      <button class="color-dot selected" style="background:#ffffff" data-color="#ffffff"></button>
      <button class="color-dot" style="background:#e8f5e9" data-color="#e8f5e9"></button>
      <button class="color-dot" style="background:#fff3cd" data-color="#fff3cd"></button>
      <button class="color-dot" style="background:#fce4ec" data-color="#fce4ec"></button>
      <button class="color-dot" style="background:#e3f2fd" data-color="#e3f2fd"></button>
      <button class="color-dot" style="background:#ede7f6" data-color="#ede7f6"></button>
    </div>

    <div class="editor-actions">
      <button class="secondary-btn" onclick="closeEditor()">Cancel</button>
      <button class="primary-btn" onclick="saveItem()">Save</button>
    </div>
  </div>
</div>

<!-- NOTIFICATION POPUP -->

<div id="notificationPopup" class="notification-popup" hidden>
  <div class="notification-card">
    <div class="notification-icon">🔔</div>
    <h2>Never miss a task!</h2>
    <p>
      Allow notifications to receive reminders about upcoming
      and overdue tasks.
    </p>
    <button id="enableNotifications">Enable Notifications</button>
    <button id="laterNotifications">Not Now</button>
    <p id="notificationMessage" aria-live="polite"></p>
  </div>
</div>

<!-- SETTINGS POPUP -->

<div class="overlay" id="settingsOverlay">
  <div class="editor">
    <h2>Settings</h2>
    <p>Manage your app preferences.</p>
    <button class="secondary-btn" style="width:100%;margin-bottom:10px" onclick="openNotificationSettings()">🔔 Notification settings</button>
    <button class="secondary-btn" style="width:100%;margin-bottom:10px" onclick="exportData()">⬇ Export my data</button>
    <button class="secondary-btn" style="width:100%;margin-bottom:10px" onclick="document.getElementById('importFile').click()">⬆ Import data</button>
    <input id="importFile" type="file" accept=".json,application/json" hidden onchange="importData(event)">
    <button class="primary-btn" style="width:100%" onclick="document.getElementById('settingsOverlay').classList.remove('show')">Close</button>
  </div>
</div>

<script>
/* STORAGE */

const STORAGE_KEY = "myNotesTasks_v1";
const SETTINGS_KEY = "myNotesSettings_v1";

let items = [];
let currentView = "all";
let editingId = null;
let editorType = "note";
let selectedColor = "#ffffff";
let checklistDraft = [];

function loadItems() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);

    if (saved) {
      items = JSON.parse(saved);
    } else {
      // Import older task data if available
      const oldData = localStorage.getItem("myTasks");

      if (oldData) {
        const oldItems = JSON.parse(oldData);

        if (Array.isArray(oldItems)) {
          items = oldItems.map(x => ({
            id: crypto.randomUUID(),
            type: "task",
            title: x.title || x.name || "Untitled task",
            body: x.description || "",
            due: x.due || "",
            priority: "normal",
            label: "",
            color: "#ffffff",
            completed: !!x.completed,
            pinned: false,
            archived: false,
            trashed: false,
            created: Date.now()
          }));
        }
      }
    }
  } catch (error) {
    console.error("Unable to load saved data", error);
    items = [];
  }

  saveItems();
}

function saveItems() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
}

function createId() {
  return crypto.randomUUID
    ? crypto.randomUUID()
    : Date.now().toString(36) + Math.random().toString(36).slice(2);
}

/* VIEWS */

function changeView(view) {
  currentView = view;

  document.querySelectorAll("[data-view]").forEach(button => {
    button.classList.toggle("active", button.dataset.view === view);
  });

  const titles = {
    all: "All items",
    notes: "My Notes",
    tasks: "My Tasks",
    checklists: "Checklists",
    pinned: "Pinned items",
    archive: "Archived items",
    trash: "Trash"
  };

  document.getElementById("pageTitle").textContent = titles[view] || "My Notes";
  renderItems();
}

/* RENDER */

function renderItems() {
  const grid = document.getElementById("itemsGrid");
  const search = document.getElementById("searchInput").value.toLowerCase();

  const activeItems = items.filter(item => !item.trashed && !item.archived);

  document.getElementById("totalCount").textContent = activeItems.length;

  document.getElementById("pendingCount").textContent =
    activeItems.filter(x => x.type === "task" && !x.completed).length;

  document.getElementById("completedCount").textContent =
    activeItems.filter(x => x.type === "task" && x.completed).length;

  let filtered = items.filter(item => {
    if (currentView === "trash") return item.trashed;
    if (currentView === "archive") return item.archived && !item.trashed;
    if (item.trashed || item.archived) return false;
    if (currentView === "notes" && item.type !== "note") return false;
    if (currentView === "tasks" && item.type !== "task") return false;
    if (currentView === "checklists" && item.type !== "checklist") return false;
    if (currentView === "pinned" && !item.pinned) return false;
    return true;
  });

  filtered = filtered.filter(item => {
    const text = `${item.title} ${item.body} ${item.label}`.toLowerCase();
    return text.includes(search);
  });

  filtered.sort((a, b) => {
    if (a.pinned !== b.pinned) return b.pinned - a.pinned;
    return (b.created || 0) - (a.created || 0);
  });

  grid.innerHTML = "";

  if (!filtered.length) {
    grid.innerHTML = `<div class="empty">✨<br><br>Nothing here yet.</div>`;
    return;
  }

  filtered.forEach(item => {
    const card = document.createElement("article");
    card.className = "note-card";
    card.style.background = item.color || "#ffffff";

    const typeIcon = item.type === "task" ? "☑️" :
      item.type === "checklist" ? "📋" : "📝";

    const title = document.createElement("h3");
    title.textContent = typeIcon + " " + (item.title || "Untitled");

    const pin = document.createElement("button");
    pin.className = "pin";
    pin.textContent = item.pinned ? "📌" : "📍";
    pin.title = "Pin or unpin";
    pin.onclick = event => {
      event.stopPropagation();
      item.pinned = !item.pinned;
      saveItems();
      renderItems();
    };

    card.appendChild(pin);
    card.appendChild(title);

    if (item.type === "checklist") {
      (item.checks || []).forEach(check => {
        const line = document.createElement("div");
        line.className = "check-row";

        const box = document.createElement("input");
        box.type = "checkbox";
        box.checked = !!check.done;
        box.onclick = event => event.stopPropagation();
        box.onchange = () => {
          check.done = box.checked;
          saveItems();
          renderItems();
        };

        const span = document.createElement("span");
        span.textContent = check.text;
        if (check.done) span.className = "done";

        line.append(box, span);
        card.appendChild(line);
      });
    } else {
      const body = document.createElement("p");
      body.textContent = item.body || (item.type === "task" ? "Task" : "");
      card.appendChild(body);
    }

    if (item.due) {
      const due = document.createElement("div");
      due.className = "note-meta";
      due.textContent = "📅 Due: " + item.due;
      card.appendChild(due);
    }

    if (item.label) {
      const label = document.createElement("div");
      label.className = "note-meta";
      label.textContent = "🏷 " + item.label;
      card.appendChild(label);
    }

    if (item.priority && item.type === "task") {
      const priority = document.createElement("div");
      priority.className = "note-meta";
      priority.textContent = "Priority: " + item.priority;
      card.appendChild(priority);
    }

    const actions = document.createElement("div");
    actions.className = "card-actions";

    function action(text, callback) {
      const button = document.createElement("button");
      button.textContent = text;
      button.onclick = event => {
        event.stopPropagation();
        callback();
      };
      actions.appendChild(button);
    }

    if (currentView === "trash") {
      action("Restore", () => restoreItem(item.id));
      action("Delete forever", () => deleteForever(item.id));
    } else if (currentView === "archive") {
      action("Unarchive", () => {
        item.archived = false;
        saveItems();
        renderItems();
      });
      action("Delete", () => moveToTrash(item.id));
    } else {
      action("Edit", () => editItem(item.id));

      if (item.type === "task") {
        action(item.completed ? "Undo" : "Complete", () => {
          item.completed = !item.completed;
          saveItems();
          renderItems();
        });
      }

      action("Archive", () => {
        item.archived = true;
        saveItems();
        renderItems();
      });

      action("Delete", () => moveToTrash(item.id));
    }

    card.appendChild(actions);
    card.onclick = () => editItem(item.id);
    grid.appendChild(card);
  });
}

/* EDITOR */

function openEditor(type) {
  editingId = null;
  editorTyp
