
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101b30">
<title>NEON RACER 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#9cc9df;font-family:Arial;color:white}
canvas{display:block}
#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}
.panel{background:#071629c9;border:1px solid #62eaff;padding:12px;border-radius:12px}
#speed{font-size:30px;color:#62eaff;font-weight:bold}
#menu,#over{position:absolute;inset:0;background:#071426c9;display:flex;align-items:center;justify-content:center;padding:15px}
.card{background:#101d35;border:1px solid #62eaff;border-radius:20px;padding:30px;text-align:center;width:min(450px,95%)}
h1{font-size:42px;color:#62eaff}
button{background:#126083;color:white;border:1px solid #62eaff;padding:14px 20px;border-radius:12px;font-weight:bold;margin:5px;touch-action:none}
.hidden{display:none!important}
#controls{position:absolute;bottom:15px;left:0;right:0;display:none;justify-content:space-between;padding:10px}
.ctrl{width:65px;height:65px;border-radius:50%;font-size:23px;background:#092746cc}
#nitro{background:#a52e62}
small{color:#b8d6e5}
</style>
</head>
<body>

<div id="hud" class="hidden">
 <div class="panel">
  <b>NEON RACER 3D</b><br>
  <small>DISTANCE</small>
  <div id="distance">0 KM</div>
  <small>SCORE: <span id="score">0</span></small>
 </div>
 <div class="panel">
  <div id="speed">0</div>
  <small>KM/H</small>
  <div>NITRO: <span id="nitroText">100</span>%</div>
 </div>
</div>

<div id="menu">
 <div class="card">
  <h1>NEON RACER 3D</h1>
  <h3>EXTREME HIGHWAY RACING</h3>
  <p>Drive through beautiful mountain and coastal highways. Overtake traffic and activate nitro!</p>
  <p>W / ↑ Accelerate<br>S / ↓ Brake<br>A / D Steer<br>SPACE Nitro</p>
  <button onclick="startGame()">START RACING</button>
 </div>
</div>

<div id="over" class="hidden">
 <div class="card">
  <h1>CRASH!</h1>
  <h2 id="result">Score: 0</h2>
  <button onclick="startGame()">RACE AGAIN</button>
  <button onclick="location.reload()">MENU</button>
 </div>
</div>

<div id="controls">
 <div>
  <button class="ctrl" id="left">◀</button>
  <button class="ctrl" id="right">▶</button>
 </div>
 <div>
  <button class="ctrl" id="brake">▼</button>
  <button class="ctrl" id="accelerate">▲</button>
  <button class="ctrl" id="nitro">N</button>
 </div>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// ---------------- SCENE ----------------

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91c9e5);
scene.fog=new THREE.Fog(0x91c9e5,100,700);

const camera=new THREE.PerspectiveCamera(
 65,innerWidth/innerHeight,.1,3000
);

const renderer=new THREE.WebGLRenderer({
 antialias:true
});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xc9ecff,0x526344,2));

const sunlight=new THREE.DirectionalLight(0xffffff,3);
sunlight.position.set(-80,120,50);
sunlight.castShadow=true;
sunlight.shadow.mapSize.set(2048,2048);
scene.add(sunlight);

// ---------------- WORLD ----------------

const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(3000,10000),
 new THREE.MeshStandardMaterial({color:0x47784b})
);
ground.rotation.x=-Math.PI/2;
ground.position.z=-3000;
ground.position.y=-.3;
ground.receiveShadow=true;
scene.add(ground);

// Mountain scenery

function mountain(x,z,scale,color){
 const m=new THREE.Mesh(
  new THREE.ConeGeometry(scale,scale*1.8,5),
  new THREE.MeshStandardMaterial({color,roughness:1})
 );
 m.position.set(x,scale*.8,z);
 m.rotation.y=Math.random()*2;
 scene.add(m);
}

for(let i=0;i<70;i++){
 let z=-Math.random()*5500-100;
 mountain(
  (Math.random()>.5?1:-1)*THREE.MathUtils.randFloat(90,250),
  z,
  THREE.MathUtils.randFloat(25,100),
  [0x526f65,0x526c75,0x758b80][i%3]
 );
}

// Road curves

function roadCenter(z){
 return Math.sin(z*.0012)*18+
        Math.sin(z*.003)*4;
}

function roadMesh(){
 let vertices=[];
 let indices=[];
 const steps=600;
 const start=100;
 const end=-6000;

 for(let i=0;i<=steps;i++){
  let z=start+(end-start)*i/steps;
  let x=roadCenter(z);

  vertices.push(x-10,.02,z);
  vertices.push(x+10,.02,z);

  if(i<steps){
   let a=i*2;
   indices.push(a,a+1,a+2);
   indices.push(a+1,a+3,a+2);
  }
 }

 let geo=new THREE.BufferGeometry();
 geo.setAttribute('position',
  new THREE.Float32BufferAttribute(vertices,3));
 geo.setIndex(indices);
 geo.computeVertexNormals();

 let mesh=new THREE.Mesh(
  geo,
  new THREE.MeshStandardMaterial({
   color:0x30343b,
   roughness:.85,
   side:THREE.DoubleSide
  })
 );

 mesh.receiveShadow=true;
 scene.add(mesh);
}
roadMesh();

// Road markings

function makeLine(offset,color){
 let points=[];
 for(let z=100;z>-6000;z-=4){
  points.push(new THREE.Vector3(
   roadCenter(z)+offset,.06,z
  ));
 }

 let geo=new THREE.BufferGeometry().setFromPoints(points);
 let line=new THREE.Line(
  geo,
  new THREE.LineBasicMaterial({color})
 );
 scene.add(line);
}

makeLine(-9.7,0xffffff);
makeLine(9.7,0xffffff);
makeLine(-3.3,0xffe8a0);
makeLine(3.3,0xffe8a0);

// Roadside barriers

for(let side of [-1,1]){
 let points=[];
 for(let z=100;z>-6000;z-=15){
  points.push(new THREE.Vector3(
   roadCenter(z)+side*11,.8,z
  ));
 }

 let curve=new THREE.CatmullRomCurve3(points);
 let rail=new THREE.Mesh(
  new THREE.TubeGeometry(curve,800,.15,6,false),
  new THREE.MeshStandardMaterial({color:0x9da9ae,metalness:.7})
 );
 scene.add(rail);
}

// ---------------- TREES ----------------

const trees=[];

function createTree(x,z){
 const group=new THREE.Group();

 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.35,.55,5,7),
  new THREE.MeshStandardMaterial({color:0x68452a})
 );
 trunk.position.y=2.5;
 trunk.castShadow=true;
 group.add(trunk);

 const leaves=new THREE.Mesh(
  new THREE.ConeGeometry(3,9,8),
  new THREE.MeshStandardMaterial({color:0x176b37})
 );
 leaves.position.y=8;
 leaves.castShadow=true;
 group.add(leaves);

 const leaves2=leaves.clone();
 leaves2.scale.set(.75,.8,.75);
 leaves2.position.y=11;
 group.add(leaves2);

 group.position.set(x,0,z);
 scene.add(group);
 trees.push(group);
}

for(let z=-30;z>-5800;z-=32){
 for(let side of [-1,1]){
  let x=roadCenter(z)+side*(18+Math.random()*35);
  createTree(x,z);
 }
}

// Some roadside buildings

for(let i=0;i<55;i++){
 let z=-100-i*95;
 let side=Math.random()>.5?1:-1;

 let building=new THREE.Mesh(
  new THREE.BoxGeometry(
   THREE.MathUtils.randFloat(8,17),
   THREE.MathUtils.randFloat(8,24),
   12
  ),
  new THREE.MeshStandardMaterial({
   color:[0xd5b99a,0xd7d5c5,0x9aaeb4][i%3]
  })
 );

 building.position.set(
  roadCenter(z)+side*THREE.MathUtils.randFloat(35,65),
  building.geometry.parameters.height/2,
  z
 );
 building.castShadow=true;
 scene.add(building);
}

// ---------------- CAR MODEL ----------------

function makeCar(color){
 const car=new THREE.Group();

 const paint=new THREE.MeshStandardMaterial({
  color,
  metalness:.65,
  roughness:.25
 });

 const body=new THREE.Mesh(
  new THREE.BoxGeometry(2.3,.65,4.4),
  paint
 );
 body.position.y=.85;
 body.castShadow=true;
 car.add(body);

 const cabin=new THREE.Mesh(
  new THREE.BoxGeometry(1.75,.7,2.1),
  new THREE.MeshStandardMaterial({
   color:0x172e42,
   metalness:.7,
   roughness:.2
  })
 );
 cabin.position.set(0,1.45,-.25);
 car.add(cabin);

 const windshield=new THREE.Mesh(
  new THREE.BoxGeometry(1.55,.48,.08),
  new THREE.MeshStandardMaterial({
   color:0x92d9ed,
   metalness:.7,
   roughness:.15
  })
 );
 windshield.position.set(0,1.48,.78);
 windshield.rotation.x=-.25;
 car.add(windshield);

 // Wheels

 const wheelGeo=new THREE.CylinderGeometry(.43,.43,.28,20);
 const wheelMat=new THREE.MeshStandardMaterial({
  color:0x101014,
  roughness:.8
 });

 const wheels=[];

 for(let x of [-1.12,1.12]){
  for(let z of [-1.35,1.35]){
   const wheel=new THREE.Mesh(wheelGeo,wheelMat);
   wheel.rotation.z=Math.PI/2;
   wheel.position.set(x,.48,z);
   wheel.castShadow=true;
   car.add(wheel);
   wheels.push(wheel);
  }
 }

 // Headlights

 for(let x of [-.75,.75]){
  const light=new THREE.Mesh(
   new THREE.BoxGeometry(.4,.18,.08),
   new THREE.MeshBasicMaterial({color:0xffffff})
  );
  light.position.set(x,.95,2.23);
  car.add(light);
 }

 // Rear lights

 for(let x of [-.75,.75]){
  const light=new THREE.Mesh(
   new THREE.BoxGeometry(.4,.18,.08),
   new THREE.MeshBasicMaterial({color:0xff172e})
  );
  light.position.set(x,.95,-2.23);
  car.add(light);
 }

 car.userData.wheels=wheels;
 return car;
}

const playerCar=makeCar(0x08aaff);
scene.add(playerCar);

let traffic=[];

function spawnTraffic(z){
 const lanes=[-6,0,6];
 const offset=lanes[Math.floor(Math.random()*lanes.length)];

 const car=makeCar(
  [0xff3434,0xffbd42,0xa65cff,0xf0f0f0][
   Math.floor(Math.random()*4)
  ]
 );

 car.position.set(roadCenter(z)+offset,0,z);
 scene.add(car);

 traffic.push({
  mesh:car,
  z,
  offset,
  speed:THREE.MathUtils.randFloat(80,145)
 });
}

// ---------------- GAME ----------------

let playerZ=0;
let steering=0;
let speed=0;
let nitroPower=100;
let score=0;
let distance=0;
let running=false;
let last=0;

const input={
 left:false,right:false,up:false,down:false,nitro:false
};

function startGame(){
 playerZ=0;
 steering=0;
 speed=0;
 nitroPower=100;
 score=0;
 distance=0;

 traffic.forEach(c=>scene.remove(c.mesh));
 traffic=[];

 for(let i=0;i<12;i++){
  spawnTraffic(-150-i*120);
 }

 running=true;

 document.getElementById("menu").classList.add("hidden");
 document.getElementById("over").classList.add("hidden");
 document.getElementById("hud").classList.remove("hidden");
 document.getElementById("controls").style.display="flex";

 last=performance.now();
 requestAnimationFrame(loop);
}

function endGame(){
 running=false;

 document.getElementById("hud").classList.add("hidden");
 document.getElementById("controls").style.display="none";
 document.getElementById("over").classList.remove("hidden");

 document.getElementById("result").textContent=
 "Score: "+score+" | Distance: "+Math.floor(distance)+" m";
}

function update(dt){
 let accelerating=input.up;
 let braking=input.down;
 let boosting=input.nitro&&nitroPower>0;

 if(accelerating)speed+=120*dt;
 else speed-=25*dt;

 if(braking)speed-=180*dt;

 if(boosting){
  speed+=250*dt;
  nitroPower-=35*dt;
 }else{
  nitroPower=Math.min(100,nitroPower+8*dt);
 }

 speed=THREE.MathUtils.clamp(speed,0,boosting?350:250);

 if(input.left)steering-=dt*1.4;
 if(input.right)steering+=dt*1.4;

 steering*=Math.pow(.12,dt);
 steering=THREE.MathUtils.clamp(steering,-7.5,7.5);

 playerZ-=speed*dt*.42;

 let center=roadCenter(playerZ);
 let playerX=center+steering;

 playerCar.position.set(playerX,.05,playerZ);
 playerCar.rotation.y=-steering*.045;
 playerCar.rotation.z=-steering*.025;

 for(let wheel of playerCar.userData.wheels){
  wheel.rotation.x-=speed*dt*.05;
 }

 // Camera follows car

 camera.position.set(
  playerX+steering*.1,
  7.5,
  playerZ+14
 );

 camera.lookAt(
  roadCenter(playerZ-35),
  1,
  playerZ-35
 );

 // Traffic

 for(let car of traffic){
  car.z+= (speed-car.speed)*dt*.42;
  car.mesh.position.z=car.z;
  car.mesh.position.x=roadCenter(car.z)+car.offset;

  if(
   Math.abs(car.z-playerZ)<5.5 &&
   Math.abs(car.mesh.position.x-playerX)<2.8
  ){
   endGame();
   return;
  }
 }

 traffic=traffic.filter(car=>{
  if(car.z>playerZ+40){
   scene.remove(car.mesh);
   return false;
  }
  return true;
 });

 if(speed>80&&traffic.length<15){
  let farthest=Math.min(...traffic.map(c=>c.z),playerZ-200);
  spawnTraffic(farthest-120);
 }

 distance+=speed*dt*.05;
 score+=Math.floor(speed*dt*.15);

 // UI

 document.getElementById("speed").textContent=
 Math.round(speed*1.1);

 document.getElementById("distance").textContent=
 (distance/1000).toFixed(2)+" KM";

 document.getElementById("score").textContent=score;
 document.getElementById("nitroText").textContent=
 Math.round(nitroPower);
}

function loop(time){
 if(!running)return;

 let dt=Math.min((time-last)/1000,.04);
 last=time;

 update(dt);
 if(!running)return;

 renderer.render(scene,camera);
 requestAnimationFrame(loop);
}

// ---------------- CONTROLS ----------------

addEventListener("keydown",e=>{
 if(e.code==="ArrowLeft"||e.code==="KeyA")input.left=true;
 if(e.code==="ArrowRight"||e.code==="KeyD")input.right=true;
 if(e.code==="ArrowUp"||e.code==="KeyW")input.up=true;
 if(e.code==="ArrowDown"||e.code==="KeyS")input.down=true;
 if(e.code==="Space")input.nitro=true;
});

addEventListener("keyup",e=>{
 if(e.code==="ArrowLeft"||e.code==="KeyA")input.left=false;
 if(e.code==="ArrowRight"||e.code==="KeyD")input.right=false;
 if(e.code==="ArrowUp"||e.code==="KeyW")input.up=false;
 if(e.code==="ArrowDown"||e.code==="KeyS")input.down=false;
 if(e.code==="Space")input.nitro=false;
});

function bind(id,key){
 const el=document.getElementById(id);
 el.addEventListener("pointerdown",e=>{
  e.preventDefault();
  input[key]=true;
 });
 for(const event of ["pointerup","pointercancel","pointerleave"]){
  el.addEventListener(event,()=>input[key]=false);
 }
}

bind("left","left");
bind("right","right");
bind("accelerate","up");
bind("brake","down");
bind("nitro","nitro");

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

// Initial view

camera.position.set(0,8,18);
camera.lookAt(0,0,-20);
renderer.render(scene,camera);

</script>
</body>
</html>
