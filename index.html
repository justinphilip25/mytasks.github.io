
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080b18">
<title>NEON STREET RACER</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#080b18;color:white;font-family:Arial}
canvas{display:block;width:100vw;height:100vh}
#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}
.panel{background:#101a32dd;border:1px solid #50f6ff;padding:10px;border-radius:10px}
.cyan{color:#50f6ff}
#speed{font-size:30px;font-weight:bold}
#menu,#over{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;background:#050817dd;padding:15px}
.card{background:#111b35;border:1px solid #50f6ff;border-radius:20px;padding:30px;text-align:center;width:min(450px,95%)}
h1{font-size:42px;color:#50f6ff}
button{background:#153d5c;color:white;border:1px solid #50f6ff;padding:15px;border-radius:12px;font-weight:bold;margin:5px}
.hidden{display:none!important}
#controls{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:15px}
.control{width:75px;height:75px;border-radius:50%;font-size:22px;background:#102e50dd;touch-action:none}
#nitro{background:#69214e}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud" class="hidden">
 <div class="panel">
  <b class="cyan">NEON RACER</b><br>
  SCORE: <span id="score">0</span><br>
  DISTANCE: <span id="distance">0</span> m
 </div>
 <div class="panel">
  <div id="speed">0</div>
  <small>KM/H</small>
  <div style="color:#50f6ff">NITRO: <span id="nitroText">100</span>%</div>
 </div>
</div>

<div id="menu">
 <div class="card">
  <h1>NEON<br>RACER</h1>
  <h3>STREET RACING</h3>
  <p>Race through neon highways. Avoid traffic, activate nitro and beat your record!</p>
  <p>ARROWS / A-D = STEER<br>W / UP = ACCELERATE<br>S / DOWN = BRAKE<br>SPACE = NITRO</p>
  <button onclick="start()">START RACE</button>
  <p>BEST: <span id="best">0</span></p>
 </div>
</div>

<div id="over" class="hidden">
 <div class="card">
  <h1>CRASH!</h1>
  <h2 id="final">Score: 0</h2>
  <button onclick="start()">RACE AGAIN</button>
  <button onclick="menu()">MENU</button>
 </div>
</div>

<div id="controls" class="hidden">
 <div>
  <button class="control" id="left">◀</button>
  <button class="control" id="right">▶</button>
 </div>
 <div>
  <button class="control" id="brake">▼</button>
  <button class="control" id="accelerate">▲</button>
  <button class="control" id="nitro">N</button>
 </div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W,H;
function resize(){
 W=canvas.width=innerWidth;
 H=canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

let running=false;
let player,traffic=[];
let speed=0,score=0,distance=0;
let nitro=100;
let roadOffset=0;
let spawnTimer=0;
let last=0;
let best=Number(localStorage.racerBest||0);

document.getElementById("best").textContent=best;

let input={
 left:false,right:false,up:false,down:false,nitro:false
};

function start(){
 player={x:0.5,damage:0};
 traffic=[];
 speed=0;
 score=0;
 distance=0;
 nitro=100;
 roadOffset=0;
 spawnTimer=0;
 running=true;

 document.getElementById("menu").classList.add("hidden");
 document.getElementById("over").classList.add("hidden");
 document.getElementById("hud").classList.remove("hidden");
 document.getElementById("controls").classList.remove("hidden");

 last=performance.now();
 requestAnimationFrame(loop);
}

function menu(){
 running=false;
 document.getElementById("over").classList.add("hidden");
 document.getElementById("menu").classList.remove("hidden");
}

function drawRoad(){
 let horizon=H*.22;
 let bottom=H;

 ctx.fillStyle="#101b24";
 ctx.fillRect(0,0,W,H);

 // Background skyline
 for(let i=0;i<30;i++){
  let x=i*W/25;
  let bh=40+(i*37%100);
  ctx.fillStyle="#111b35";
  ctx.fillRect(x,horizon-bh,35,bh);
 }

 // Road
 ctx.fillStyle="#292d39";
 ctx.beginPath();
 ctx.moveTo(W*.43,horizon);
 ctx.lineTo(W*.57,horizon);
 ctx.lineTo(W*.98,bottom);
 ctx.lineTo(W*.02,bottom);
 ctx.closePath();
 ctx.fill();

 // Road borders
 ctx.strokeStyle="#50f6ff";
 ctx.lineWidth=4;
 ctx.beginPath();
 ctx.moveTo(W*.43,horizon);
 ctx.lineTo(W*.02,bottom);
 ctx.moveTo(W*.57,horizon);
 ctx.lineTo(W*.98,bottom);
 ctx.stroke();

 // Lane markings
 for(let i=0;i<12;i++){
  let y=((i*100+roadOffset)%H);
  let t=(y-horizon)/(H-horizon);
  if(t<0)continue;
  let width=2+t*5;
  let x1=W*(.5-t*.07);
  let x2=W*(.5+t*.07);
  ctx.fillStyle="#ffffff";
  ctx.fillRect(x1-2,y,width,width*5);
  ctx.fillRect(x2-2,y,width,width*5);
 }

 // Ground glow
 ctx.fillStyle="#50f6ff22";
 ctx.fillRect(0,H-5,W,5);
}

function drawCar(x,y,color,scale=1){
 let w=42*scale,h=75*scale;

 ctx.save();
 ctx.translate(x,y);

 ctx.shadowBlur=20;
 ctx.shadowColor=color;

 ctx.fillStyle=color;
 ctx.beginPath();
 ctx.roundRect(-w/2,-h/2,w,h,8*scale);
 ctx.fill();

 ctx.shadowBlur=0;

 ctx.fillStyle="#111b35";
 ctx.fillRect(-w*.34,-h*.22,w*.68,h*.27);

 ctx.fillStyle="#9beeff";
 ctx.fillRect(-w*.34,-h*.18,w*.68,h*.12);

 ctx.fillStyle="#ffedaa";
 ctx.fillRect(-w*.38,h*.34,w*.25,5*scale);
 ctx.fillRect(w*.13,h*.34,w*.25,5*scale);

 ctx.fillStyle="#080b18";
 ctx.fillRect(-w*.6,-h*.3,w*.15,h*.25);
 ctx.fillRect(w*.45,-h*.3,w*.15,h*.25);

 ctx.restore();
}

function spawnTraffic(){
 let lane=[.36,.5,.64][Math.floor(Math.random()*3)];

 traffic.push({
  x:lane,
  y:-100,
  speed:Math.random()*.35+.45,
  color:["#ff4777","#9b7bff","#ffc45c","#50f6ff"][Math.floor(Math.random()*4)]
 });
}

function update(dt){
 let acceleration=input.up?260:0;
 let braking=input.down?350:0;
 let boosting=input.nitro&&nitro>0;

 speed+=acceleration*dt;
 speed-=braking*dt;

 if(boosting){
  speed+=400*dt;
  nitro-=35*dt;
 }else{
  nitro=Math.min(100,nitro+9*dt);
 }

 speed=Math.max(0,Math.min(450,speed));
 if(!boosting)speed=Math.min(speed,300);

 let steer=0;
 if(input.left)steer-=1;
 if(input.right)steer+=1;

 player.x+=steer*dt*(1.2+speed/180);
 player.x=Math.max(.12,Math.min(.88,player.x));

 roadOffset+=speed*dt*.9;
 distance+=speed*dt/10;
 score+=Math.floor(speed*dt/10);

 spawnTimer-=dt;
 if(spawnTimer<=0&&speed>40){
  spawnTraffic();
  spawnTimer=Math.max(.35,1.3-speed/500);
 }

 for(let car of traffic){
  car.y+=(180+speed*car.speed)*dt;

  let carX=W*(car.x);
  let playerX=W*player.x;

  if(car.y>H-170&&car.y<H-65&&Math.abs(carX-playerX)<48){
   endGame();
   return;
  }
 }

 traffic=traffic.filter(c=>c.y<H+100);

 document.getElementById("speed").textContent=Math.round(speed*.55);
 document.getElementById("score").textContent=score;
 document.getElementById("distance").textContent=Math.floor(distance);
 document.getElementById("nitroText").textContent=Math.round(nitro);
}

function draw(){
 drawRoad();

 // Traffic
 for(let car of traffic){
  drawCar(W*car.x,car.y,car.color,.8);
 }

 // Player
 drawCar(W*player.x,H-120,"#50f6ff",1.1);

 // Speed particles
 if(input.nitro&&nitro>0){
  for(let i=0;i<3;i++){
   ctx.fillStyle="#50f6ff88";
   ctx.fillRect(Math.random()*W,H-20-Math.random()*100,3,20);
  }
 }
}

function endGame(){
 running=false;

 document.getElementById("hud").classList.add("hidden");
 document.getElementById("controls").classList.add("hidden");
 document.getElementById("over").classList.remove("hidden");

 if(score>best){
  best=score;
  localStorage.racerBest=best;
  document.getElementById("best").textContent=best;
 }

 document.getElementById("final").textContent="Score: "+score+" | Distance: "+Math.floor(distance)+" m";
}

function loop(t){
 if(!running)return;

 let dt=Math.min((t-last)/1000,.04);
 last=t;

 update(dt);
 if(running)draw();

 if(running)requestAnimationFrame(loop);
}

addEventListener("keydown",e=>{
 if(e.code==="ArrowLeft"||e.code==="KeyA")input.left=true;
 if(e.code==="ArrowRight"||e.code==="KeyD")input.right=true;
 if(e.code==="ArrowUp"||e.code==="KeyW")input.up=true;
 if(e.code==="ArrowDown"||e.code==="KeyS")input.down=true;
 if(e.code==="Space")input.nitro=true;
});

addEventListener("keyup",e=>{
 if(e.code==="ArrowLeft"||e.code==="KeyA")input.left=false;
 if(e.code==="ArrowRight"||e.code==="KeyD")input.right=false;
 if(e.code==="ArrowUp"||e.code==="KeyW")input.up=false;
 if(e.code==="ArrowDown"||e.code==="KeyS")input.down=false;
 if(e.code==="Space")input.nitro=false;
});

function bindButton(id,key){
 let b=document.getElementById(id);
 b.addEventListener("pointerdown",e=>{
  e.preventDefault();
  input[key]=true;
 });
 ["pointerup","pointercancel","pointerleave"].forEach(ev=>{
  b.addEventListener(ev,()=>input[key]=false);
 });
}

bindButton("left","left");
bindButton("right","right");
bindButton("brake","down");
bindButton("accelerate","up");
bindButton("nitro","nitro");

drawRoad();
</script>
</body>
 </html>
