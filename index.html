
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#6750a4">
<meta name="description" content="A simple notes, tasks and checklist app.">
<title>My Tasks & Notes</title>

<style>
:root {
  --primary:#6750a4;
  --primary-light:#eee8ff;
  --bg:#f7f6fb;
  --surface:#ffffff;
  --text:#25232b;
  --muted:#777480;
  --border:#e9e6ef;
  --danger:#d93025;
  --shadow:0 3px 14px rgba(30,20,50,.07);
}

* { box-sizing:border-box; }

body {
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,textarea,select {
  font:inherit;
}

button {
  cursor:pointer;
}

.app {
  min-height:100vh;
  display:flex;
}

.sidebar {
  width:245px;
  background:#fff;
  border-right:1px solid var(--border);
  padding:22px 14px;
  position:fixed;
  top:0;
  bottom:0;
  left:0;
  z-index:5;
}

.brand {
  font-size:23px;
  font-weight:800;
  color:var(--primary);
  padding:8px 12px 25px;
}

.nav {
  display:flex;
  align-items:center;
  gap:14px;
  padding:13px 16px;
  border-radius:30px;
  margin-bottom:5px;
  color:#56515f;
  cursor:pointer;
  border:0;
  background:transparent;
  width:100%;
  text-align:left;
}

.nav:hover { background:#f3f0fa; }

.nav.active {
  background:var(--primary-light);
  color:var(--primary);
  font-weight:700;
}

.nav .count {
  margin-left:auto;
  font-size:12px;
  color:var(--muted);
}

.main {
  margin-left:245px;
  width:calc(100% - 245px);
  padding:25px 35px 60px;
  max-width:1600px;
}

.topbar {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:25px;
}

.page-title {
  font-size:27px;
  font-weight:750;
}

.top-actions {
  display:flex;
  align-items:center;
  gap:9px;
}

.icon-btn {
  border:0;
  background:white;
  border-radius:50%;
  width:42px;
  height:42px;
  box-shadow:var(--shadow);
  font-size:18px;
}

.search-box {
  background:#fff;
  border:1px solid var(--border);
  border-radius:30px;
  padding:13px 19px;
  display:flex;
  align-items:center;
  gap:10px;
  width:min(520px,100%);
  margin:0 auto 25px;
}

.search-box input {
  border:0;
  outline:0;
  flex:1;
  min-width:0;
  background:transparent;
}

.create-box {
  max-width:700px;
  margin:0 auto 28px;
  padding:15px;
  background:white;
  border:1px solid var(--border);
  border-radius:15px;
  box-shadow:var(--shadow);
}

.create-top {
  display:flex;
  gap:10px;
}

.create-top input {
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  font-size:16px;
  padding:10px;
}

.primary-btn {
  border:0;
  background:var(--primary);
  color:white;
  padding:12px 20px;
  border-radius:25px;
  font-weight:700;
}

.secondary-btn {
  border:1px solid var(--border);
  background:white;
  color:var(--text);
  padding:10px 14px;
  border-radius:22px;
}

.create-options {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}

.filters {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:15px 0 22px;
}

.filter {
  border:1px solid var(--border);
  background:white;
  border-radius:22px;
  padding:9px 15px;
  color:var(--muted);
}

.filter.active {
  background:var(--primary-light);
  border-color:var(--primary-light);
  color:var(--primary);
  font-weight:700;
}

.stats {
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:22px;
}

.stat {
  background:white;
  border:1px solid var(--border);
  border-radius:12px;
  padding:13px 17px;
  min-width:115px;
}

.stat strong {
  display:block;
  font-size:22px;
  margin-top:5px;
}

.stat span {
  color:var(--muted);
  font-size:12px;
}

.cards {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:16px;
}

.card {
  background:white;
  border:1px solid rgba(0,0,0,.06);
  border-radius:15px;
  padding:17px;
  box-shadow:var(--shadow);
  min-width:0;
  overflow-wrap:anywhere;
}

.card.pinned {
  border:1px solid #c3a8ff;
}

.card-top {
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:flex-start;
}

.card h3 {
  font-size:17px;
  margin:0 0 13px;
  line-height:1.4;
}

.card-content {
  white-space:pre-wrap;
  line-height:1.6;
  font-size:14px;
}

.pin-button {
  border:0;
  background:transparent;
  font-size:18px;
}

.meta {
  color:var(--muted);
  font-size:11px;
  margin-top:17px;
  line-height:1.7;
}

.actions {
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  border-top:1px solid rgba(0,0,0,.07);
  margin-top:12px;
  padding-top:10px;
}

.actions button {
  border:0;
  background:rgba(255,255,255,.65);
  color:#554c66;
  padding:7px 9px;
  border-radius:8px;
  font-size:11px;
}

.actions button:hover {
  background:var(--primary-light);
}

.check-item {
  display:flex;
  align-items:center;
  gap:9px;
  margin:9px 0;
  font-size:14px;
}

.check-item input {
  accent-color:var(--primary);
  width:17px;
  height:17px;
}

.checked {
  text-decoration:line-through;
  color:var(--muted);
}

.empty {
  grid-column:1/-1;
  text-align:center;
  padding:70px 20px;
  color:var(--muted);
}

.empty strong {
  display:block;
  margin:12px;
  color:var(--text);
}

.notification-banner {
  max-width:700px;
  margin:0 auto 20px;
  padding:13px;
  border-radius:12px;
  background:#eee8ff;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  font-size:13px;
}

.notification-banner[hidden] { display:none; }

.overlay {
  display:none;
  position:fixed;
  inset:0;
  z-index:20;
  background:rgba(15,10,25,.5);
  align-items:center;
  justify-content:center;
  padding:15px;
}

.overlay.open { display:flex; }

.editor {
  width:min(570px,100%);
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:19px;
  padding:23px;
  box-shadow:0 15px 60px rgba(0,0,0,.2);
}

.editor h2 {
  margin:0 0 20px;
}

.field {
  margin-bottom:15px;
}

.field label {
  display:block;
  font-size:12px;
  font-weight:700;
  color:var(--muted);
  margin-bottom:7px;
}

.field input,
.field textarea,
.field select {
  width:100%;
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px;
  outline:none;
  background:white;
}

.field input:focus,
.field textarea:focus,
.field select:focus {
  border-color:var(--primary);
}

.field textarea {
  min-height:140px;
  resize:vertical;
}

.form-row {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.editor-actions {
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:20px;
}

.editor-actions button {
  border:0;
  border-radius:24px;
  padding:11px 17px;
}

.danger-btn {
  color:var(--danger);
  background:#fff0ef;
}

.toast {
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  opacity:0;
  pointer-events:none;
  background:#29252f;
  color:white;
  padding:13px 21px;
  border-radius:30px;
  z-index:50;
  transition:.25s;
  max-width:90%;
  text-align:center;
}

.toast.show {
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.mobile-menu {
  display:none;
}

.footer {
  text-align:center;
  color:var(--muted);
  font-size:12px;
  padding:35px 0;
}

@media(max-width:800px) {
  .sidebar {
    width:72px;
    padding:15px 7px;
  }

  .brand {
    font-size:0;
    text-align:center;
    padding:12px 0 24px;
  }

  .brand:first-letter {
    font-size:25px;
  }

  .nav {
    justify-content:center;
    padding:14px 5px;
    font-size:19px;
  }

  .nav .nav-text,
  .nav .count {
    display:none;
  }

  .main {
    margin-left:72px;
    width:calc(100% - 72px);
    padding:20px 15px 50px;
  }

  .page-title {
    font-size:22px;
  }

  .cards {
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  }
}

@media(max-width:500px) {
  .main {
    padding:16px 12px 45px;
  }

  .topbar {
    margin-bottom:17px;
  }

  .cards {
    grid-template-columns:1fr;
  }

  .create-top {
    flex-wrap:wrap;
  }

  .create-top input {
    width:100%;
    flex-basis:100%;
  }

  .form-row {
    grid-template-columns:1fr;
  }

  .notification-banner {
    align-items:flex-start;
    flex-direction:column;
  }

  .editor {
    padding:18px;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar">
    <div class="brand">✦ My Notes</div>

    <button class="nav active" data-view="all">
      <span>▦</span><span class="nav-text">All notes</span>
    </button>

    <button class="nav" data-view="notes">
      <span>▤</span><span class="nav-text">Notes</span>
      <span class="count" id="noteCount">0</span>
    </button>

    <button class="nav" data-view="tasks">
      <span>☑</span><span class="nav-text">Tasks</span>
      <span class="count" id="taskCount">0</span>
    </button>

    <button class="nav" data-view="checklists">
      <span>☷</span><span class="nav-text">Checklists</span>
    </button>

    <button class="nav" data-view="pinned">
      <span>📌</span><span class="nav-text">Pinned</span>
    </button>

    <button class="nav" data-view="archive">
      <span>▣</span><span class="nav-text">Archive</span>
    </button>

    <button class="nav" data-view="trash">
      <span>♲</span><span class="nav-text">Trash</span>
    </button>
  </aside>

  <main class="main">

    <header class="topbar">
      <div class="page-title" id="pageTitle">All notes</div>

      <div class="top-actions">
        <button class="icon-btn" id="backupButton"
          data-action="export" title="Backup">↓</button>

        <button class="icon-btn" id="restoreButton"
          data-action="import" title="Restore">↑</button>
      </div>
    </header>

    <div class="search-box">
      <span>⌕</span>
      <input id="search" type="search"
        placeholder="Search notes and tasks...">
    </div>

    <div class="notification-banner" id="notificationBanner" hidden>
      <span>🔔 Enable notifications for reminders while the app is open.</span>
      <button class="primary-btn" data-action="notifications">
        Enable
      </button>
    </div>

    <section class="create-box">
      <div class="create-top">
        <input id="quickTitle" placeholder="Create a new note or task...">
        <button class="primary-btn" id="quickCreate">＋ Create</button>
      </div>

      <div class="create-options">
        <button class="secondary-btn" data-new-type="note">▤ Note</button>
        <button class="secondary-btn" data-new-type="task">☑ Task</button>
        <button class="secondary-btn" data-new-type="checklist">☷ Checklist</button>
      </div>
    </section>

    <section class="stats" id="stats">
      <div class="stat">
        <span>NOTES</span>
        <strong id="noteCount">0</strong>
      </div>

      <div class="stat">
        <span>OPEN TASKS</span>
        <strong id="taskCount">0</strong>
      </div>

      <div class="stat">
        <span>COMPLETED</span>
        <strong id="doneCount">0</strong>
      </div>
    </section>

    <section class="filters" id="filters">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="today">Due today</button>
      <button class="filter" data-filter="overdue">Overdue</button>
      <button class="filter" data-filter="high">High priority</button>
    </section>

    <section class="cards" id="cards">
      <div class="empty">Loading your notes...</div>
    </section>

    <footer class="footer">
      My Tasks & Notes · Your data is stored on this device.
    </footer>

  </main>
</div>

<!-- EDITOR -->

<div class="overlay" id="editorOverlay">
  <form class="editor" id="editorForm">

    <h2 id="editorHeading">Create item</h2>

    <input type="hidden" id="itemId">

    <div class="field">
      <label for="itemType">TYPE</label>
      <select id="itemType">
        <option value="note">Note</option>
        <option value="task">Task</option>
        <option value="checklist">Checklist</option>
      </select>
    </div>

    <div class="field">
      <label for="itemTitle">TITLE</label>
      <input id="itemTitle" maxlength="150"
        placeholder="Enter title">
    </div>

    <div class="field">
      <label id="contentLabel" for="itemBody">CONTENT</label>
      <textarea id="itemBody"
        placeholder="Write something..."></textarea>
    </div>

    <div class="form-row">

      <div class="field">
        <label for="itemDue">DUE DATE</label>
        <input id="itemDue" type="date">
      </div>

      <div class="field">
        <label for="itemPriority">PRIORITY</label>
        <select id="itemPriority">
          <option value="normal">Normal</option>
          <option value="high">High</option>
          <option value="low">Low</option>
        </select>
      </div>

    </div>

    <div class="form-row">

      <div class="field">
        <label for="itemLabel">LABEL</label>
        <input id="itemLabel" placeholder="e.g. College">
      </div>

      <div class="field">
        <label for="itemColor">CARD COLOUR</label>
        <select id="itemColor">
          <option value="#ffffff">White</option>
          <option value="#fff4cc">Yellow</option>
          <option value="#e7f4ff">Blue</option>
          <option value="#e8f7e9">Green</option>
          <option value="#ffe9ed">Pink</option>
          <option value="#f0eaff">Purple</option>
        </select>
      </div>

    </div>

    <div class="editor-actions">
      <button type="button" class="danger-btn"
        id="deleteButton" hidden>Move to trash</button>

      <div style="display:flex;gap:8px;margin-left:auto">
        <button type="button" class="secondary-btn"
          id="cancelButton">Cancel</button>

        <button type="submit" class="primary-btn">Save</button>
      </div>
    </div>

  </form>
</div>

<input type="file" id="importFile"
  accept=".json,application/json" hidden>

<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';

const DB_NAME = 'MyTasksNotesDB';
const DB_VERSION = 1;
const STORE = 'items';

let db;
let items = [];
let currentView = 'all';
let currentFilter = 'all';

const $ = id => document.getElementById(id);

function id() {
  return crypto.randomUUID
    ? crypto.randomUUID()
    : Date.now() + '-' + Math.random().toString(16).slice(2);
}

function safe(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  })[c]);
}

function today() {
  const d = new Date();
  return d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');
}

function toast(message) {
  $('toast').textContent = message;
  $('toast').classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(
    () => $('toast').classList.remove('show'), 2500
  );
}

// DATABASE

function openDB() {
  return new Promise((resolve,reject) => {
    const request = indexedDB.open(DB_NAME,DB_VERSION);

    request.onupgradeneeded = () => {
      if (!request.result.objectStoreNames.contains(STORE)) {
        request.result.createObjectStore(STORE,{keyPath:'id'});
      }
    };

    request.onsuccess = () => {
      db = request.result;
      resolve(db);
    };

    request.onerror = () => reject(request.error);
  });
}

function getAll() {
  return new Promise((resolve,reject) => {
    const request = db.transaction(STORE,'readonly')
      .objectStore(STORE).getAll();

    request.onsuccess = () => resolve(request.result || []);
    request.onerror = () => reject(request.error);
  });
}

function saveDB(item) {
  return new Promise((resolve,reject) => {
    const tx = db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).put(item);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}

function deleteDB(itemId) {
  return new Promise((resolve,reject) => {
    const tx = db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).delete(itemId);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}

async function reload() {
  items = await getAll();
  render();
}

// NAVIGATION

function setView(view) {
  currentView = view;
  currentFilter = 'all';

  document.querySelectorAll('[data-view]').forEach(button => {
    button.classList.toggle(
      'active',button.dataset.view === view
    );
  });

  document.querySelectorAll('[data-filter]').forEach(button => {
    button.classList.toggle(
      'active',button.dataset.filter === 'all'
    );
  });

  const titles = {
    all:'All notes',
    notes:'Notes',
    tasks:'Tasks',
    checklists:'Checklists',
    pinned:'Pinned',
    archive:'Archive',
    trash:'Trash'
  };

  $('pageTitle').textContent = titles[view] || 'All notes';
  $('stats').hidden = !['all','notes'].includes(view);
  $('filters').hidden = !['all','tasks'].includes(view);

  render();
}

function setFilter(filter) {
  currentFilter = filter;

  document.querySelectorAll('[data-filter]').forEach(button => {
    button.classList.toggle(
      'active',button.dataset.filter === filter
    );
  });

  render();
}

// FILTERS

function getVisibleItems() {
  const query = $('search').value.toLowerCase().trim();

  return items.filter(item => {
    if (currentView === 'trash') {
      if (!item.trashed) return false;
    } else {
      if (item.trashed) return false;

      if (currentView === 'archive') {
        if (!item.archived) return false;
      } else {
        if (item.archived) return false;
        if (currentView === 'notes' && item.type !== 'note') return false;
        if (currentView === 'tasks' && item.type !== 'task') return false;
        if (currentView === 'checklists' && item.type !== 'checklist') return false;
        if (currentView === 'pinned' && !item.pinned) return false;
      }
    }

    if (currentFilter === 'today' && item.due !== today()) return false;

    if (currentFilter === 'overdue' &&
        (!item.due || item.due >= today() || item.done)) return false;

    if (currentFilter === 'high' && item.priority !== 'high') return false;

    const checkText = (item.checks || [])
      .map(c => c.text).join(' ');

    const text = [
      item.title,item.body,item.label,checkText
    ].join(' ').toLowerCase();

    return !query || text.includes(query);
  });
}

// RENDER

function render() {
  const active = items.filter(i =>
    !i.trashed && !i.archived
  );

  $('noteCount').textContent =
    active.filter(i => i.type === 'note').length;

  $('taskCount').textContent =
    active.filter(i => i.type === 'task' && !i.done).length;

  $('doneCount').textContent =
    active.filter(i =>
      (i.type === 'task' && i.done) ||
      (i.type === 'checklist' &&
       i.checks.length &&
       i.checks.every(c => c.done))
    ).length;

  const list = getVisibleItems().sort((a,b) =>
    Number(b.pinned)-Number(a.pinned) ||
    b.updatedAt-a.updatedAt
  );

  if (!list.length) {
    $('cards').innerHTML = `
      <div class="empty">
        <div style="font-size:42px">✧</div>
        <strong>Nothing here yet</strong>
        Create a note, task or checklist to get started.
      </div>`;
    return;
  }

  $('cards').innerHTML = list.map(item => {
    let content = '';

    if (item.type === 'checklist') {
      content = (item.checks || []).map((c,index) => `
        <label class="check-item">
          <input type="checkbox"
            data-action="checkItem"
            data-id="${safe(item.id)}"
            data-index="${index}"
            ${c.done?'checked':''}>
          <span class="${c.done?'checked':''}">
            ${safe(c.text)}
          </span>
        </label>
      `).join('');
    } else if (item.type === 'task') {
      content = `
        <label class="check-item">
          <input type="checkbox"
            data-action="toggleTask"
            data-id="${safe(item.id)}"
            ${item.done?'checked':''}>
          <span class="${item.done?'checked':''}">
            ${safe(item.body || 'Complete this task')}
          </span>
        </label>`;
    } else {
      content = `<div class="card-content">${sa
