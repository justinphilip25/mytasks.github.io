
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON RIFT - Arena Survival</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b18;color:white;font-family:Arial;overflow:hidden}
canvas{display:block;width:100vw;height:100vh}
#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;gap:10px}
.panel{background:#101a32dd;border:1px solid #50f6ff;padding:10px;border-radius:10px}
.cyan{color:#50f6ff}
#health,#xp{height:8px;background:#333;width:150px;margin-top:5px;border-radius:10px;overflow:hidden}
#health div{height:100%;background:#ff4777;width:100%}
#xp div{height:100%;background:#50f6ff;width:0%}
#menu,#upgrade,#gameover{position:absolute;inset:0;background:#050817dd;display:flex;align-items:center;justify-content:center;padding:15px}
.card{background:#111b35;border:1px solid #50f6ff;padding:30px;border-radius:18px;text-align:center;width:min(500px,95%)}
h1{font-size:48px;color:#50f6ff;margin:10px}
button{background:#153d5c;color:white;border:1px solid #50f6ff;padding:14px 20px;border-radius:10px;font-weight:bold;margin:5px;cursor:pointer}
button:hover{background:#23658a}
.hidden{display:none!important}
#choices{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#choices button{flex:1;min-width:110px}
#mobile{position:absolute;bottom:20px;left:20px;right:20px;display:none;justify-content:space-between}
#stick{width:110px;height:110px;border-radius:50%;background:#153d5caa;border:2px solid #50f6ff;position:relative;touch-action:none}
#knob{width:40px;height:40px;background:#50f6ff;border-radius:50%;position:absolute;left:33px;top:33px}
#dash{border-radius:50%;width:80px;height:80px;background:#641d55}
@media(max-width:700px){
#mobile{display:flex}
h1{font-size:38px}
#health,#xp{width:90px}
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud" class="hidden">
 <div class="panel">
  <b class="cyan">NEON RIFT</b><br>
  <small>HEALTH</small>
  <div id="health"><div id="hpbar"></div></div>
  <small>XP</small>
  <div id="xp"><div id="xpbar"></div></div>
 </div>
 <div class="panel">
  SCORE: <b id="score">0</b><br>
  LEVEL: <b id="level">1</b><br>
  SECTOR: <b id="wave">1</b>
 </div>
</div>

<div id="menu">
 <div class="card">
  <h1>NEON RIFT</h1>
  <h3>ARENA SURVIVAL</h3>
  <p>Fight endless enemy waves. Collect energy, upgrade weapons and survive the void.</p>
  <p>WASD / ARROWS = MOVE<br>SPACE = DASH<br>Automatic shooting</p>
  <button onclick="startGame()">START GAME</button>
  <p>BEST SCORE: <span id="best">0</span></p>
 </div>
</div>

<div id="upgrade" class="hidden">
 <div class="card">
  <h1>LEVEL UP!</h1>
  <p>Choose an upgrade</p>
  <div id="choices"></div>
 </div>
</div>

<div id="gameover" class="hidden">
 <div class="card">
  <h1>GAME OVER</h1>
  <h2 id="finalscore"></h2>
  <button onclick="startGame()">PLAY AGAIN</button>
  <button onclick="mainMenu()">MENU</button>
 </div>
</div>

<div id="mobile">
 <div id="stick"><div id="knob"></div></div>
 <button id="dash" onclick="dashPlayer()">DASH</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W,H;
function resize(){
 W=canvas.width=innerWidth;
 H=canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

let player,enemies=[],bullets=[],orbs=[],particles=[];
let keys={},score=0,level=1,xp=0;
let xpNeed=10,wave=1,kills=0;
let running=false,paused=false;
let spawnTimer=0,fireTimer=0,dashTimer=0;
let joystick={x:0,y:0};
let last=0;

let best=Number(localStorage.getItem("riftBest")||0);
document.getElementById("best").innerText=best;

const upgrades=[
 {name:"Rapid Fire",desc:"Shoot 25% faster",apply:()=>player.rate*=.75},
 {name:"Heavy Bullets",desc:"Increase bullet damage",apply:()=>player.damage+=12},
 {name:"Speed Boost",desc:"Move faster",apply:()=>player.speed*=1.2},
 {name:"Max Health",desc:"Increase max health and heal",apply:()=>{player.maxHp+=25;player.hp=Math.min(player.maxHp,player.hp+40)}},
 {name:"Magnet",desc:"Collect XP from farther away",apply:()=>player.magnet+=80},
 {name:"Weapon Spread",desc:"Fire extra bullets",apply:()=>player.shots++},
 {name:"Dash Reactor",desc:"Reduce dash cooldown",apply:()=>player.dashCooldown*=.7}
];

function startGame(){
 player={
  x:W/2,y:H/2,r:13,
  hp:100,maxHp:100,
  speed:240,damage:20,
  rate:.35,shots:1,
  magnet:100,
  dashCooldown:2
 };

 enemies=[];
 bullets=[];
 orbs=[];
 particles=[];

 score=0;level=1;xp=0;xpNeed=10;
 wave=1;kills=0;
 spawnTimer=0;fireTimer=0;dashTimer=0;
 running=true;paused=false;

 document.getElementById("menu").classList.add("hidden");
 document.getElementById("gameover").classList.add("hidden");
 document.getElementById("upgrade").classList.add("hidden");
 document.getElementById("hud").classList.remove("hidden");

 last=performance.now();
 requestAnimationFrame(loop);
}

function mainMenu(){
 running=false;
 document.getElementById("gameover").classList.add("hidden");
 document.getElementById("menu").classList.remove("hidden");
}

function spawnEnemy(){
 let a=Math.random()*Math.PI*2;
 let d=Math.max(W,H)*.65;
 let type=Math.random();

 let enemy={
  x:player.x+Math.cos(a)*d,
  y:player.y+Math.sin(a)*d,
  hp:30+wave*8,
  maxHp:30+wave*8,
  speed:60+wave*4,
  r:13,
  damage:12,
  color:"#ff4f9a"
 };

 if(wave>=2&&type>.7){
  enemy.speed=120+wave*3;
  enemy.hp=25+wave*5;
  enemy.color="#ffc45c";
  enemy.r=10;
 }

 if(wave>=3&&type>.88){
  enemy.speed=35;
  enemy.hp=180+wave*20;
  enemy.r=24;
  enemy.damage=25;
  enemy.color="#9b7bff";
 }

 if(wave%5===0&&Math.random()>.9){
  enemy.hp=600+wave*40;
  enemy.maxHp=enemy.hp;
  enemy.r=34;
  enemy.color="#ff5533";
  enemy.speed=45;
  enemy.damage=35;
 }

 enemies.push(enemy);
}

function nearestEnemy(){
 let target=null,bestDist=Infinity;
 for(let e of enemies){
  let d=(e.x-player.x)**2+(e.y-player.y)**2;
  if(d<bestDist){bestDist=d;target=e}
 }
 return target;
}

function shoot(){
 let target=nearestEnemy();
 if(!target)return;

 let angle=Math.atan2(target.y-player.y,target.x-player.x);

 for(let i=0;i<player.shots;i++){
  let offset=(i-(player.shots-1)/2)*.15;
  let a=angle+offset;

  bullets.push({
   x:player.x,y:player.y,
   vx:Math.cos(a)*600,
   vy:Math.sin(a)*600,
   damage:player.damage,
   life:1.5
  });
 }
}

function dashPlayer(){
 if(!running||paused||dashTimer>0)return;

 let dx=(keys.KeyD||keys.ArrowRight?1:0)-
       (keys.KeyA||keys.ArrowLeft?1:0)+joystick.x;

 let dy=(keys.KeyS||keys.ArrowDown?1:0)-
       (keys.KeyW||keys.ArrowUp?1:0)+joystick.y;

 let d=Math.hypot(dx,dy);
 if(d===0){dx=1;d=1}

 player.x+=dx/d*130;
 player.y+=dy/d*130;

 player.x=Math.max(15,Math.min(W-15,player.x));
 player.y=Math.max(15,Math.min(H-15,player.y));

 dashTimer=player.dashCooldown;
 player.invulnerable=.35;
}

function levelUp(){
 level++;
 paused=true;

 let options=[...upgrades].sort(()=>Math.random()-.5).slice(0,3);
 let box=document.getElementById("choices");
 box.innerHTML="";

 for(let u of options){
  let b=document.createElement("button");
  b.innerHTML="<b>"+u.name+"</b><br><small>"+u.desc+"</small>";

  b.onclick=()=>{
   u.apply();
   paused=false;
   document.getElementById("upgrade").classList.add("hidden");
  };

  box.appendChild(b);
 }

 document.getElementById("upgrade").classList.remove("hidden");
}

function update(dt){
 if(paused)return;

 spawnTimer-=dt;
 fireTimer-=dt;
 dashTimer-=dt;

 if(player.invulnerable>0)player.invulnerable-=dt;

 let dx=(keys.KeyD||keys.ArrowRight?1:0)-
        (keys.KeyA||keys.ArrowLeft?1:0)+joystick.x;

 let dy=(keys.KeyS||keys.ArrowDown?1:0)-
        (keys.KeyW||keys.ArrowUp?1:0)+joystick.y;

 let len=Math.hypot(dx,dy)||1;

 player.x=Math.max(15,Math.min(W-15,player.x+dx/len*player.speed*dt));
 player.y=Math.max(15,Math.min(H-15,player.y+dy/len*player.speed*dt));

 if(spawnTimer<=0){
  spawnEnemy();
  spawnTimer=Math.max(.18,1-wave*.04);
 }

 if(fireTimer<=0){
  shoot();
  fireTimer=player.rate;
 }

 for(let e of enemies){
  let a=Math.atan2(player.y-e.y,player.x-e.x);
  e.x+=Math.cos(a)*e.speed*dt;
  e.y+=Math.sin(a)*e.speed*dt;

  if(Math.hypot(player.x-e.x,player.y-e.y)<player.r+e.r){
   if(!player.invulnerable){
    player.hp-=e.damage*dt;
   }
  }
 }

 for(let b of bullets){
  b.x+=b.vx*dt;
  b.y+=b.vy*dt;
  b.life-=dt;

  for(let e of enemies){
   if(e.hp>0&&Math.hypot(b.x-e.x,b.y-e.y)<e.r+5){
    e.hp-=b.damage;
    b.life=0;
    if(e.hp<=0){
     score+=100+wave*10;
     kills++;
     orbs.push({x:e.x,y:e.y});
     burst(e.x,e.y,e.color);
    }
    break;
   }
  }
 }

 bullets=bullets.filter(b=>b.life>0);
 enemies=enemies.filter(e=>e.hp>0);

 for(let o of orbs){
  let d=Math.hypot(player.x-o.x,player.y-o.y);

  if(d<player.magnet){
   let a=Math.atan2(player.y-o.y,player.x-o.x);
   o.x+=Math.cos(a)*180*dt;
   o.y+=Math.sin(a)*180*dt;
  }

  if(d<player.r+10){
   o.got=true;
   xp++;
   score+=10;

   if(xp>=xpNeed){
    xp-=xpNeed;
    xpNeed=Math.ceil(xpNeed*1.35);
    levelUp();
   }
  }
 }

 orbs=orbs.filter(o=>!o.got);

 for(let p of particles){
  p.x+=p.vx*dt;
  p.y+=p.vy*dt;
  p.life-=dt;
 }

 particles=particles.filter(p=>p.life>0);

 if(kills>=wave*10){
  wave++;
  score+=wave*100;
  kills=0;
 }

 if(player.hp<=0)endGame();

 document.getElementById("hpbar").style.width=
 Math.max(0,player.hp/player.maxHp*100)+"%";

 document.getElementById("xpbar").style.width=
 xp/xpNeed*100+"%";

 document.getElementById("score").innerText=score;
 document.getElementById("level").innerText=level;
 document.getElementById("wave").innerText=wave;
}

function burst(x,y,color){
 for(let i=0;i<12;i++){
  let a=Math.random()*Math.PI*2;
  let speed=40+Math.random()*160;
  particles.push({
   x,y,
   vx:Math.cos(a)*speed,
   vy:Math.sin(a)*speed,
   life:.5,
   color
  });
 }
}

function draw(){
 ctx.fillStyle="#080b18";
 ctx.fillRect(0,0,W,H);

 // Grid
 ctx.strokeStyle="#17243a";
 ctx.lineWidth=1;
 for(let x=0;x<W;x+=45){
  ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
 }
 for(let y=0;y<H;y+=45){
  ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
 }

 // XP orbs
 for(let o of orbs){
  ctx.fillStyle="#a77bff";
  ctx.shadowBlur=15;
  ctx.shadowColor="#a77bff";
  ctx.beginPath();ctx.arc(o.x,o.y,6,0,Math.PI*2);ctx.fill();
 }

 // Bullets
 ctx.shadowBlur=12;
 ctx.shadowColor="#50f6ff";
 ctx.fillStyle="#50f6ff";

 for(let b of bullets){
  ctx.beginPath();ctx.arc(b.x,b.y,4,0,Math.PI*2);ctx.fill();
 }

 ctx.shadowBlur=0;

 // Enemies
 for(let e of enemies){
  ctx.fillStyle=e.color;
  ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();

  ctx.fillStyle="#333";
  ctx.fillRect(e.x-e.r,e.y-e.r-9,e.r*2,4);

  ctx.fillStyle="#ff5577";
  ctx.fillRect(e.x-e.r,e.y-e.r-9,e.r*2*Math.max(0,e.hp/e.maxHp),4);
 }

 // Player
 ctx.shadowBlur=25;
 ctx.shadowColor="#50f6ff";
 ctx.fillStyle=player.invulnerable>0?"white":"#50f6ff";
 ctx.beginPath();
 ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
 ctx.fill();
 ctx.shadowBlur=0;

 ctx.strokeStyle="white";
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.arc(player.x,player.y,player.r+5,0,Math.PI*2);
 ctx.stroke();

 // Particles
 for(let p of particles){
  ctx.globalAlpha=Math.max(0,p.life*2);
  ctx.fillStyle=p.color;
  ctx.fillRect(p.x,p.y,3,3);
 }
 ctx.globalAlpha=1;
}

function endGame(){
 running=false;

 document.getElementById("hud").classList.add("hidden");
 document.getElementById("gameover").classList.remove("hidden");

 if(score>best){
  best=score;
  localStorage.setItem("riftBest",best);
 }

 document.getElementById("best").innerText=best;
 document.getElementById("finalscore").innerText=
 "Score: "+score+" | Sector: "+wave;
}

function loop(time){
 if(!running)return;

 let dt=Math.min((time-last)/1000,.033);
 last=time;

 update(dt);
 draw();

 requestAnimationFrame(loop);
}

addEventListener("keydown",e=>{
 keys[e.code]=true;
 if(e.code==="Space"){
  e.preventDefault();
  dashPlayer();
 }
});

addEventListener("keyup",e=>keys[e.code]=false);

// Mobile joystick
const stick=document.getElementById("stick");
const knob=document.getElementById("knob");
let dragging=false;

stick.addEventListener("pointerdown",e=>{
 dragging=true;
 stick.setPointerCapture(e.pointerId);
});

stick.addEventListener("pointermove",e=>{
 if(!dragging)return;

 let r=stick.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2);
 let dy=e.clientY-(r.top+r.height/2);
 let d=Math.hypot(dx,dy);
 let m=Math.min(1,40/(d||1));

 joystick.x=dx*m/40;
 joystick.y=dy*m/40;

 knob.style.transform=
 `translate(${joystick.x*35}px,${joystick.y*35}px)`;
});

function stopStick(){
 dragging=false;
 joystick={x:0,y:0};
 knob.style.transform="";
}

stick.addEventListener("pointerup",stopStick);
stick.addEventListener("pointercancel",stopStick);

</script>
</body>
  </html>
