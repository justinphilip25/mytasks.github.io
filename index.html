
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fbbc04">
<title>My Notes & Tasks</title>

<style>
:root {
  --bg:#f8f9fa;
  --surface:#fff;
  --text:#202124;
  --muted:#777;
  --border:#e5e5e5;
  --accent:#fbbc04;
  --shadow:0 2px 8px #00000012;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
header{
  height:65px;
  display:flex;
  align-items:center;
  gap:14px;
  padding:0 20px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:5;
}
.logo{font-size:21px;font-weight:bold;white-space:nowrap}
.logo span{color:#fbbc04}
.search{
  flex:1;
  max-width:650px;
  margin:auto;
}
.search input{
  width:100%;
  padding:13px 17px;
  border:0;
  border-radius:9px;
  background:#f1f3f4;
  outline:none;
}
.header-actions{display:flex;gap:8px}
.icon-btn{
  border:0;
  background:transparent;
  padding:10px;
  border-radius:50%;
  font-size:18px;
}
.icon-btn:hover{background:#eee}
.layout{display:flex;min-height:calc(100vh - 65px)}
aside{
  width:230px;
  padding:20px 10px;
  flex-shrink:0;
}
.nav-btn{
  width:100%;
  border:0;
  background:transparent;
  padding:13px 17px;
  text-align:left;
  border-radius:0 25px 25px 0;
  font-size:15px;
  margin-bottom:5px;
}
.nav-btn.active,.nav-btn:hover{background:#feefc3}
main{flex:1;padding:25px;min-width:0}
.topline{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
  margin-bottom:20px;
}
h2{font-size:21px;margin:0}
.small{color:var(--muted);font-size:13px}
.create{
  width:min(600px,100%);
  margin:0 auto 25px;
  background:var(--surface);
  border-radius:10px;
  box-shadow:var(--shadow);
  padding:14px 17px;
  display:flex;
  align-items:center;
  gap:12px;
}
.create input{
  flex:1;
  border:0;
  outline:none;
  font-size:15px;
  min-width:0;
}
.create button{
  border:0;
  background:transparent;
  font-size:20px;
  padding:6px;
}
.notes{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:15px;
  align-items:start;
}
.note{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:11px;
  padding:15px;
  min-height:125px;
  box-shadow:var(--shadow);
  overflow-wrap:anywhere;
  transition:.15s;
}
.note:hover{box-shadow:0 4px 15px #0002}
.note h3{margin:0 30px 10px 0;font-size:16px}
.note-body{white-space:pre-wrap;font-size:14px;line-height:1.5}
.note-footer{
  display:flex;
  align-items:center;
  gap:4px;
  margin-top:14px;
  flex-wrap:wrap;
}
.note-footer button{
  border:0;
  background:transparent;
  padding:7px;
  border-radius:50%;
  font-size:15px;
}
.note-footer button:hover{background:#00000012}
.pin{
  float:right;
  border:0;
  background:transparent;
  font-size:17px;
}
.check-row{
  display:flex;
  gap:8px;
  align-items:flex-start;
  margin:8px 0;
  font-size:14px;
}
.check-row input{margin-top:3px}
.done{text-decoration:line-through;color:#888}
.empty{
  text-align:center;
  color:var(--muted);
  padding:70px 10px;
  grid-column:1/-1;
}
dialog{
  border:0;
  border-radius:13px;
  width:min(570px,94vw);
  padding:0;
  box-shadow:0 10px 45px #0004;
  background:var(--surface);
  color:var(--text);
}
dialog::backdrop{background:#0006}
.editor{padding:20px}
.editor input,.editor textarea,.editor select{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--surface);
  color:var(--text);
  outline-color:var(--accent);
}
.editor textarea{min-height:130px;resize:vertical}
.editor-actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
}
.primary{
  border:0;
  background:#fbbc04;
  padding:10px 18px;
  border-radius:8px;
  font-weight:bold;
}
.secondary{
  border:1px solid var(--border);
  background:var(--surface);
  padding:9px 14px;
  border-radius:8px;
}
.colors{display:flex;gap:9px;margin-bottom:14px}
.color{
  width:27px;height:27px;border-radius:50%;
  border:2px solid #0002;
}
#toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#333;
  color:white;
  padding:12px 20px;
  border-radius:8px;
  display:none;
  z-index:20;
}
#reminderStatus{
  font-size:12px;
  color:var(--muted);
  margin-top:10px;
}
@media(max-width:650px){
  header{padding:0 10px;gap:7px}
  .logo{font-size:17px}
  aside{width:65px;padding:15px 5px}
  .nav-btn{font-size:0;text-align:center;padding:14px 5px}
  .nav-btn span{font-size:20px}
  main{padding:15px 10px}
  .notes{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:9px}
  .note{padding:12px}
}
</style>
</head>

<body>

<header>
  <div class="logo"><span>✦</span> My Notes</div>
  <div class="search">
    <input id="searchInput" placeholder="Search your notes and tasks...">
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="exportBtn" title="Export">⬇</button>
    <button class="icon-btn" id="importBtn" title="Import">⬆</button>
    <button class="icon-btn" id="themeBtn" title="Toggle theme">◐</button>
  </div>
</header>

<div class="layout">
  <aside>
    <button class="nav-btn active" data-view="all"><span>📝</span> Notes</button>
    <button class="nav-btn" data-view="tasks"><span>☑️</span> Tasks</button>
    <button class="nav-btn" data-view="pinned"><span>📌</span> Pinned</button>
    <button class="nav-btn" data-view="archive"><span>📦</span> Archive</button>
    <button class="nav-btn" data-view="trash"><span>🗑️</span> Trash</button>
  </aside>

  <main>
    <div class="topline">
      <div>
        <h2 id="pageTitle">Notes</h2>
        <div class="small" id="countLabel">Your personal space</div>
      </div>
      <button class="secondary" id="newTaskBtn">＋ New task</button>
    </div>

    <div class="create">
      <input id="quickTitle" placeholder="Write a new note...">
      <button id="quickNoteBtn" title="Create note">✏️</button>
      <button id="quickTaskBtn" title="Create task">☑️</button>
    </div>

    <div id="notesContainer" class="notes"></div>
  </main>
</div>

<dialog id="editorDialog">
  <form class="editor" id="noteForm">
    <h2 id="editorHeading">New note</h2>
    <br>
    <input id="titleInput" placeholder="Title">
    <textarea id="bodyInput" placeholder="Write something..."></textarea>

    <label class="small">Type</label>
    <select id="typeInput">
      <option value="note">Note</option>
      <option value="task">Task</option>
      <option value="checklist">Checklist</option>
    </select>

    <label class="small">Reminder date and time</label>
    <input id="reminderInput" type="datetime-local">

    <label class="small">Choose colour</label>
    <div class="colors">
      <button type="button" class="color" data-color="#ffffff" style="background:#fff"></button>
      <button type="button" class="color" data-color="#fff2cc" style="background:#fff2cc"></button>
      <button type="button" class="color" data-color="#d9ead3" style="background:#d9ead3"></button>
      <button type="button" class="color" data-color="#d9eafc" style="background:#d9eafc"></button>
      <button type="button" class="color" data-color="#f4cccc" style="background:#f4cccc"></button>
      <button type="button" class="color" data-color="#eadcf8" style="background:#eadcf8"></button>
    </div>

    <div class="editor-actions">
      <button type="button" class="secondary" id="deleteBtn">Delete</button>
      <div>
        <button type="button" class="secondary" id="closeBtn">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </div>
    <div id="reminderStatus"></div>
  </form>
</dialog>

<input type="file" id="importFile" accept=".json,application/json" hidden>
<div id="toast"></div>

<script>
"use strict";

const DB_NAME = "MyNotesTasksDB";
const STORE = "items";

let db;
let items = [];
let currentView = "all";
let editingId = null;
let selectedColor = "#ffffff";

const $ = id => document.getElementById(id);

function toast(message) {
  const el = $("toast");
  el.textContent = message;
  el.style.display = "block";
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.style.display = "none", 2500);
}

function openDatabase() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, 1);
    request.onupgradeneeded = () => {
      const database = request.result;
      if (!database.objectStoreNames.contains(STORE)) {
        database.createObjectStore(STORE, {keyPath:"id"});
      }
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

function transaction(mode, action) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, mode);
    const store = tx.objectStore(STORE);
    let request;
    try {
      request = action(store);
    } catch (error) {
      reject(error);
      return;
    }
    tx.oncomplete = () => resolve(request?.result);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}

async function loadItems() {
  items = await transaction("readonly", store => store.getAll());
  render();
}

async function saveItem(item) {
  await transaction("readwrite", store => store.put(item));
  await loadItems();
}

async function deleteItem(id) {
  await transaction("readwrite", store => store.delete(id));
  await loadItems();
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  })[char]);
}

function visibleItems() {
  const query = $("searchInput").value.trim().toLowerCase();

  return items.filter(item => {
    const matchesSearch =
      (item.title || "").toLowerCase().includes(query) ||
      (item.body || "").toLowerCase().includes(query);

    if (!matchesSearch) return false;

    if (currentView === "trash") return item.trashed;
    if (item.trashed) return false;

    if (currentView === "archive") return item.archived;
    if (item.archived) return false;

    if (currentView === "pinned") return item.pinned;
    if (currentView === "tasks") return item.type === "task" || item.type === "checklist";

    return true;
  });
}

function render() {
  const container = $("notesContainer");
  const list = visibleItems();

  const titles = {
    all:"Notes",
    tasks:"Tasks",
    pinned:"Pinned",
    archive:"Archive",
    trash:"Trash"
  };

  $("pageTitle").textContent = titles[currentView];
  $("countLabel").textContent = list.length + " items";

  if (!list.length) {
    container.innerHTML = `<div class="empty">✨<br><br>Nothing here yet</div>`;
    return;
  }

  const pinned = list.filter(item => item.pinned && currentView === "all");
  const others = list.filter(item => !pinned.includes(item));
  const ordered = [...pinned, ...others];

  container.innerHTML = ordered.map(item => {
    let body = "";

    if (item.type === "checklist") {
      const checks = Array.isArray(item.checks) ? item.checks : [];
      body = checks.map((check, index) => `
        <label class="check-row">
          <input type="checkbox" data-check="${index}" data-id="${item.id}"
            ${check.done ? "checked" : ""}>
          <span class="${check.done ? "done" : ""}">${escapeHTML(check.text)}</span>
        </label>
      `).join("");
    } else {
      body = `<div class="note-body">${escapeHTML(item.body || "")}</div>`;
    }

    const reminder = item.reminder
      ? `<div class="small">⏰ ${escapeHTML(new Date(item.reminder).toLocaleString())}</div>`
      : "";

    return `
      <article class="note" style="background:${escapeHTML(item.color || "#fff")}">
        <button class="pin" data-action="pin" data-id="${item.id}" title="Pin">📌</button>
        <h3>${escapeHTML(item.title || "Untitled")}</h3>
        ${body}
        ${reminder}
        <div class="note-footer">
          <button data-action="edit" data-id="${item.id}" title="Edit">✏️</button>
          ${item.trashed ? `
            <button data-action="restore" data-id="${item.id}" title="Restore">↩️</button>
            <button data-action="permanent" data-id="${item.id}" title="Delete permanently">❌</button>
          ` : `
            <button data-action="archive" data-id="${item.id}" title="Archive">📦</button>
            <button data-action="trash" data-id="${item.id}" title="Move to trash">🗑️</button>
          `}
        </div>
      </article>
    `;
  }).join("");
}

function openEditor(item = null, type = "note") {
  editingId = item?.id || null;
  selectedColor = item?.color || "#ffffff";

  $("editorHeading").textContent = item ? "Edit item" : "New " + type;
  $("titleInput").value = item?.title || "";
  $("bodyInput").value = item?.body || "";
  $("typeInput").value = item?.type || type;
  $("reminderInput").value = item?.reminder || "";
  $("deleteBtn").style.visibility = item ? "visible" : "hidden";
  $("reminderStatus").textContent = "";

  $("editorDialog").showModal();
}

function closeEditor() {
  $("editorDialog").close();
  editingId = null;
}

function createItem(type, title = "") {
  openEditor(null, type);
  $("titleInput").value = title;
}

$("noteForm").addEventListener("submit", async event => {
  event.preventDefault();

  const title = $("titleInput").value.trim();
  const body = $("bodyInput").value.trim();
  const type = $("typeInput").value;
  const reminder = $("reminderInput").value;

  if (!title && !body) {
    toast("Please enter a title or content");
    return;
  }

  let old = items.find(item => item.id === editingId);

  const item = {
    id: editingId || crypto.randomUUID(),
    title,
    body,
    type,
    color: selectedColor,
    reminder,
    pinned: old?.pinned || false,
    archived: old?.archived || false,
    trashed: old?.trashed || false,
    checks: type === "checklist"
      ? body.split("\n").map(text => text.trim()).filter(Boolean).map(text => ({
          text,
          done: old?.checks?.find(check => check.text === text)?.done || false
        }))
      : [],
    created: old?.created || new Date().toISOString(),
    updated: new Date().toISOString()
  };

  await saveItem(item);
  closeEditor();
  toast("Saved successfully");
});

$("closeBtn").addEventListener("click", closeEditor);

$("deleteBtn").addEventListener("click", async () => {
  if (!editingId) return;
  if (!confirm("Move this item to trash?")) return;

  const item = items.find(entry => entry.id === editingId);
  if (item) {
    item.trashed = true;
    await saveItem(item);
  }
  closeEditor();
  toast("Moved to trash");
});

document.querySelectorAll(".color").forEach(button => {
  button.addEventListener("click", () => {
    selectedColor = button.dataset.color;
    $("editorDialog").querySelector(".editor").style.borderTop =
      "5px solid " + selectedColor;
  });
});

document.querySelectorAll(".nav-btn").forEach(button => {
  button.addEventListener("click", () => {
    currentView = button.dataset.view;
    document.querySelectorAll(".nav-btn").forEach(btn =>
      btn.classList.toggle("active", btn === button)
    );
    render();
  });
});

$("notesContainer").addEventListener("click", async event => {
  const button = event.target.closest("button[data-action]");
  if (!button) return;

  const item = items.find(entry => entry.id === button.dataset.id);
  if (!item) return;

  switch (button.dataset.action) {
    case "edit":
      openEditor(item);
      break;
    case "pin":
      item.pinned = !item.pinned;
      await saveItem(item);
      toast(item.pinned ? "Pinned" : "Unpinned");
      break;
    case "archive":
      item.archived = true;
      await saveItem(item);
      toast("Archived");
      break;
    case "trash":
      item.trashed = true;
      await saveItem(item);
      toast("Moved to trash");
      break;
    case "restore":
      item.trashed = false;
      await saveItem(item);
      toast("Restored");
      break;
    case "permanent":
      if (confirm("Permanently delete this item?")) {
        await deleteItem(item.id);
        toast("Deleted permanently");
      }
      break;
  }
});

$("notesContainer").addEventListener("change", async event => {
  const checkbox = event.target.closest("input[data-check]");
  if (!checkbox) return;

  const item = items.find(entry => entry.id === checkbox.dataset.id);
  if (!item) return;

  const index = Number(checkbox.dataset.check);
  if (!item.checks?.[index]) return;

  item.checks[index].done = checkbox.checked;
  await saveItem(item);
});

$("quickNoteBtn").addEventListener("click", () => {
  createItem("note", $("quickTitle").value);
  $("quickTitle").value = "";
});

$("quickTaskBtn").addEventListener("click", () => {
  createItem("task", $("quickTitle").value);
  $("quickTitle").value = "";
});

$("newTaskBtn").addEventListener("click", () => createItem("task"));

$("quickTitle").addEventListener("keydown", event => {
  if (event.key === "Enter") $("quickNoteBtn").click();
});

$("searchInput").addEventListener("input", render);

$("exportBtn").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(items, null, 2)], {
    type:"application/json"
  });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "my-notes-backup.json";
  link.click();
  URL.revokeObjectURL(url);
  toast("Backup exported");
});

$("importBtn").addEventListener("click", () => $("importFile").click());

$("importFile").addEventListener("change", async event => {
  const file = event.target.files[0];
  if (!file) return;

  try {
    const imported = JSON.parse(await file.text());
    if (!Array.isArray(imported)) throw new Error("Invalid backup");

    for (const item of imported) {
      if (item && typeof item.id === "string") {
        await transaction("readwrite", store => store.put(item));
      }
    }
    await loadItems();
    toast("Backup imported");
  } catch {
    toast("Could not import this file");
  }
  event.target.value = "";
});

$("themeBtn").addEventListener("click", () => {
  const dark = document.body.dataset.theme !== "dark";
  document.body.dataset.theme = dark ? "dark" : "light";

  document.documentElement.style.setProperty("--bg", dark ? "#202124" : "#f8f9fa");
  document.documentElement.style.setProperty("--surface", dark ? "#303134" : "#fff");
  document.documentElement.style.setProperty("--text", dark ? "#f1f3f4" : "#202124");
  document.documentElement.style.setProperty("--muted", dark ? "#bbb" : "#777");
  document.documentElement.style.setProperty("--border", dark ? "#555" : "#e5e5e5");
});

async function requestNotifications() {
  if (!("Notification" in window)) {
    toast("Notifications are not supported in this browser");
    return false;
  }

  const permission = await Notification.requestPermission();
  if (permission === "granted") {
    toast("Notifications enabled");
    return true;
  }

  toast("Notification permission was not granted");
  return false;
}

async function checkReminders() {
  if (!("Notification" in window) || Notification.permission !== "granted") return;

  const now = Date.now();

  for (const item of items) {
    if (!item.reminder || item.trashed || item.reminded) continue;

    const reminderTime = new Date(item.reminder).getTime();

    if (Number.isFinite(reminderTime) && reminderTime <= now) {
      new Notification(item.title || "Reminder", {
        body: item.body || "You have a reminder"
      });

      item.reminded = true;
      await transaction("readwrite", store => store.put(item));
    }
  }
}

$("reminderInput").addEventListener("focus", () => {
  if ("Notification" in window && Notification.permission === "default") {
    $("reminderStatus").innerHTML =
      '<button type="button" class="secondary" id="enableNotifications">Enable notifications</button>';
    $("enableNotifications").onclick = requestNotifications;
  }
});

async function start() {
  try {
    db = await openDatabase();
    await loadItems();
    await checkReminders();

    // Checks reminders while this page remains open.
    setInterval(checkReminders, 30000);
  } catch (error) {
    console.error(error);
    toast("Could not open local storage. Try another browser.");
  }
}

start();
</script>
</body>
</html>
