
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#168653">
<title>My Tasks</title>
<link rel="manifest" href="./manifest.json">
<style>
:root {
  --green:#168653;
  --dark:#116b42;
  --light:#eaf7ef;
  --bg:#f5f8f6;
  --text:#17251d;
  --muted:#78867d;
  --border:#e5ece7;
}
*{box-sizing:border-box}
body{
  margin:0;
  padding:22px 16px 45px;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
main{max-width:650px;margin:auto}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:10px 0 25px;
}
h1{font-size:27px;margin:0;color:var(--dark)}
header p{color:var(--muted);margin:7px 0 0;font-size:13px}
.logo{
  width:45px;height:45px;border-radius:15px;
  display:grid;place-items:center;
  background:var(--light);color:var(--green);
  font-size:24px;font-weight:bold;
}
.card{
  background:white;border:1px solid var(--border);
  border-radius:18px;padding:19px;margin-bottom:15px;
  box-shadow:0 4px 18px #163b2110;
}
h3{font-size:16px;margin:0 0 16px}
.stats{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:10px;margin-bottom:15px;
}
.stat{
  background:var(--light);padding:15px 8px;
  border-radius:14px;text-align:center;
}
.stat strong{display:block;font-size:23px;color:var(--dark)}
.stat span{font-size:11px;color:var(--muted)}
.progress-track{
  height:9px;background:#e9f0eb;
  border-radius:20px;overflow:hidden;margin-top:12px;
}
#progressBar{
  height:100%;width:0;background:var(--green);
  border-radius:20px;transition:width .3s;
}
input,select,button{
  font:inherit;border-radius:11px;
}
input,select{
  width:100%;padding:13px;margin:5px 0 11px;
  border:1px solid var(--border);
  background:white;color:var(--text);
  outline:none;
}
input:focus,select:focus{border-color:var(--green)}
button{
  border:0;padding:12px 16px;
  cursor:pointer;font-weight:bold;
}
.primary{background:var(--green);color:white;width:100%}
.primary:active{background:var(--dark)}
.filters{
  display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;
}
.filter{
  background:#f0f4f1;color:#536158;
  padding:9px 13px;font-size:12px;
}
.filter.active{background:var(--green);color:white}
.task{
  display:flex;align-items:center;gap:11px;
  padding:14px 0;border-bottom:1px solid var(--border);
}
.task:last-child{border-bottom:0}
.task input[type=checkbox]{
  width:19px;height:19px;margin:0;
  accent-color:var(--green);flex-shrink:0;
}
.task-info{flex:1;min-width:0}
.task-name{font-size:14px;font-weight:bold;overflow-wrap:anywhere}
.task.done .task-name{
  text-decoration:line-through;color:#9aa59d;
}
.task-meta{font-size:11px;color:var(--muted);margin-top:6px}
.priority{
  display:inline-block;padding:4px 8px;
  border-radius:20px;font-size:10px;margin-left:5px;
  background:#eef3ef;color:#536158;
}
.priority.High{background:#fff0ed;color:#c34c3d}
.priority.Low{background:#edf4ff;color:#4775b7}
.delete{
  background:#fff0ed;color:#c34c3d;
  padding:8px 11px;font-size:17px;
}
.empty{text-align:center;color:var(--muted);padding:25px 5px;font-size:13px}
.section-title{display:flex;justify-content:space-between;align-items:center}
#taskCount{font-size:12px;color:var(--muted)}
@media(max-width:380px){
  body{padding:15px 10px}
  .card{padding:15px}
}
</style>
</head>
<body>
<main>
<header>
  <div>
    <h1>My Tasks ✦</h1>
    <p id="today">Your day, organized.</p>
  </div>
  <div class="logo">✓</div>
</header>

<div class="card">
  <h3>My Progress</h3>
  <div class="stats">
    <div class="stat"><strong id="total">0</strong><span>Total tasks</span></div>
    <div class="stat"><strong id="completed">0</strong><span>Completed</span></div>
    <div class="stat"><strong id="pending">0</strong><span>Pending</span></div>
  </div>
  <div class="section-title">
    <span style="font-size:12px;color:#78867d">Completion progress</span>
    <strong id="percent" style="font-size:12px;color:#168653">0%</strong>
  </div>
  <div class="progress-track"><div id="progressBar"></div></div>
</div>

<div class="card">
  <h3>＋ Add a new task</h3>
  <form id="taskForm">
    <input id="taskName" placeholder="What do you need to do?" maxlength="180" required>
    <label for="taskDate" style="font-size:12px;color:#78867d">Due date</label>
    <input id="taskDate" type="date">
    <label for="priority" style="font-size:12px;color:#78867d">Priority</label>
    <select id="priority">
      <option>Normal</option>
      <option>High</option>
      <option>Low</option>
    </select>
    <button class="primary" type="submit">＋ Add Task</button>
  </form>
</div>

<div class="card">
  <div class="section-title">
    <h3 style="margin:0">Your tasks</h3>
    <span id="taskCount">0 tasks</span>
  </div>
  <input id="search" placeholder="⌕ Search tasks...">
  <div class="filters">
    <button class="filter active" data-filter="All">All</button>
    <button class="filter" data-filter="Pending">Pending</button>
    <button class="filter" data-filter="Completed">Completed</button>
  </div>
  <div id="list"></div>
</div>
</main>

<script>
const STORAGE_KEY = "myTasks";
let tasks = [];
let currentFilter = "All";

try {
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  if (Array.isArray(saved)) tasks = saved;
} catch(e) {
  tasks = [];
}

document.getElementById("today").textContent =
  new Date().toLocaleDateString("en-IN", {
    weekday:"long", day:"numeric", month:"long", year:"numeric"
  });

function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  render();
}

document.getElementById("taskForm").addEventListener("submit", e=>{
  e.preventDefault();
  const name = document.getElementById("taskName").value.trim();
  if(!name) return;

  tasks.unshift({
    id: Date.now().toString() + Math.random().toString(16).slice(2),
    name,
    date: document.getElementById("taskDate").value,
    priority: document.getElementById("priority").value,
    done:false
  });

  document.getElementById("taskName").value = "";
  document.getElementById("taskDate").value = "";
  document.getElementById("priority").value = "Normal";
  save();
});

document.getElementById("search").addEventListener("input",render);

document.querySelectorAll(".filter").forEach(button=>{
  button.addEventListener("click",()=>{
    currentFilter = button.dataset.filter;
    document.querySelectorAll(".filter").forEach(b=>
      b.classList.toggle("active",b===button)
    );
    render();
  });
});

function render(){
  const done = tasks.filter(t=>t.done).length;
  const total = tasks.length;
  const percent = total ? Math.round(done/total*100) : 0;

  document.getElementById("total").textContent = total;
  document.getElementById("completed").textContent = done;
  document.getElementById("pending").textContent = total-done;
  document.getElementById("percent").textContent = percent+"%";
  document.getElementById("progressBar").style.width = percent+"%";

  const query = document.getElementById("search").value.toLowerCase();
  const filtered = tasks.filter(t=>{
    const matchesSearch = t.name.toLowerCase().includes(query);
    const matchesFilter =
      currentFilter==="All" ||
      (currentFilter==="Pending" && !t.done) ||
      (currentFilter==="Completed" && t.done);
    return matchesSearch && matchesFilter;
  });

  document.getElementById("taskCount").textContent =
    filtered.length+" shown";

  const list = document.getElementById("list");
  list.replaceChildren();

  if(!filtered.length){
    const empty = document.createElement("div");
    empty.className="empty";
    empty.textContent=tasks.length ? "No matching tasks found." :
      "No tasks yet. Add your first task above!";
    list.append(empty);
    return;
  }

  filtered.forEach(t=>{
    const row=document.createElement("div");
    row.className="task"+(t.done?" done":"");

    const check=document.createElement("input");
    check.type="checkbox";
    check.checked=!!t.done;
    check.setAttribute("aria-label","Complete task");
    check.addEventListener("change",()=>{
      t.done=check.checked;
      save();
    });

    const info=document.createElement("div");
    info.className="task-info";

    const name=document.createElement("div");
    name.className="task-name";
    name.textContent=t.name;

    const meta=document.createElement("div");
    meta.className="task-meta";
    meta.textContent=t.date ? "Due "+t.date : "No due date";

    const priority=document.createElement("span");
    priority.className="priority "+(t.priority||"Normal");
    priority.textContent=(t.priority||"Normal")+" priority";
    meta.append(priority);
    info.append(name,meta);

    const del=document.createElement("button");
    del.className="delete";
    del.textContent="×";
    del.setAttribute("aria-label","Delete task");
    del.addEventListener("click",()=>{
      if(confirm("Delete this task?")){
        tasks=tasks.filter(item=>item.id!==t.id);
        save();
      }
    });

    row.append(check,info,del);
    list.append(row);
  });
}

render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js").catch(console.error);
  });
}
</script>
</body>
      </html>
